<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 447" width="100%" height="447">  <defs>
    <linearGradient id='grad-lfq' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='var(--bar-lfq-start)' />
      <stop offset='100%' stop-color='var(--bar-lfq-end)' />
    </linearGradient>
    <linearGradient id='grad-alt' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='var(--bar-alt-start)' />
      <stop offset='100%' stop-color='var(--bar-alt-end)' />
    </linearGradient>
  </defs>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f8fafc;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bar-lfq-start: #4f46e5;
      --bar-lfq-end: #6366f1;
      --bar-alt-start: #94a3b8;
      --bar-alt-end: #cbd5e1;
      --badge-bg: #e0e7ff;
      --badge-text: #4338ca;
      --badge-border: #c7d2fe;
      --grid-line: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card-bg: #161b22;
        --card-border: #30363d;
        --text-main: #f0f6fc;
        --text-muted: #8b949e;
        --bar-lfq-start: #6366f1;
        --bar-lfq-end: #818cf8;
        --bar-alt-start: #475569;
        --bar-alt-end: #64748b;
        --badge-bg: #1e1b4b;
        --badge-text: #a5b4fc;
        --badge-border: #3730a3;
        --grid-line: #21262d;
      }
    }
    .card { fill: var(--card-bg); stroke: var(--card-border); stroke-width: 1px; rx: 12px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: var(--text-main); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; fill: var(--text-muted); }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: var(--text-main); text-anchor: end; }
    .label-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: var(--text-muted); text-anchor: end; }
    .val { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; font-weight: 600; fill: var(--text-main); }
    .badge-rect { fill: var(--badge-bg); stroke: var(--badge-border); stroke-width: 1px; rx: 10px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: var(--badge-text); text-anchor: middle; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: var(--text-muted); text-anchor: middle; }
    .grid { stroke: var(--grid-line); stroke-dasharray: 3 3; stroke-width: 1px; }
  </style>
  <rect x="1" y="1" width="848" height="445" class="card" />
  <text x="32" y="38" class="title">Contention Throughput at 4P:4C (Ops / ms)</text>
  <text x="32" y="58" class="subtitle">1,000,000 operations under 8-thread saturation (AMD EPYC 9V45 96-Core Processor, 4 cores, linux amd64)</text>
  <line x1="367.5" y1="70" x2="367.5" y2="412" class="grid" />
  <text x="367.5" y="427" class="axis-label">9,571 ops/ms</text>
  <line x1="470.0" y1="70" x2="470.0" y2="412" class="grid" />
  <text x="470.0" y="427" class="axis-label">19,142 ops/ms</text>
  <line x1="572.5" y1="70" x2="572.5" y2="412" class="grid" />
  <text x="572.5" y="427" class="axis-label">28,713 ops/ms</text>
  <line x1="675.0" y1="70" x2="675.0" y2="412" class="grid" />
  <text x="675.0" y="427" class="axis-label">38,284 ops/ms</text>
  <text x="250" y="94" class="label">lockfree BQueue (Bounded MPMC)</text>
  <text x="250" y="106" class="label-desc">Nim • 4 producers, 4 consumers (4P:4C)</text>
  <rect x="265" y="80" width="188.4" height="28" rx="5" fill="url(#grad-lfq)"   />
  <text x="463.4" y="98" class="val">17,591.7 ops/ms</text>
  <rect x="595.3956260388533" y="84" width="54" height="20" class="badge-rect" />
  <text x="622.3956260388533" y="98" class="badge-text">9.5x</text>
  <text x="250" y="140" class="label">lockfree Queue (Unbounded MPMC)</text>
  <text x="250" y="152" class="label-desc">Nim • LCRQ DWCAS + NEBR SMR (4P:4C)</text>
  <rect x="265" y="126" width="102.2" height="28" rx="5" fill="url(#grad-lfq)"   />
  <text x="377.2" y="144" class="val">9,541.5 ops/ms</text>
  <rect x="501.1831275947988" y="130" width="54" height="20" class="badge-rect" />
  <text x="528.1831275947989" y="144" class="badge-text">5.2x</text>
  <text x="250" y="186" class="label">MoodyCamel ConcurrentQueue</text>
  <text x="250" y="198" class="label-desc">C++ • Unbounded (4P:4C)</text>
  <rect x="265" y="172" width="132.4" height="28" rx="5" fill="url(#grad-alt)"   />
  <text x="407.4" y="190" class="val">12,361.3 ops/ms</text>
  <text x="250" y="232" class="label">Boost.LockFree Queue</text>
  <text x="250" y="244" class="label-desc">C++ • Bounded (4P:4C)</text>
  <rect x="265" y="218" width="21.7" height="28" rx="5" fill="url(#grad-alt)"   />
  <text x="296.7" y="236" class="val">2,025.8 ops/ms</text>
  <text x="250" y="278" class="label">Crossbeam SegQueue</text>
  <text x="250" y="290" class="label-desc">Rust • Unbounded (4P:4C)</text>
  <rect x="265" y="264" width="379.6" height="28" rx="5" fill="url(#grad-alt)"   />
  <text x="654.6" y="282" class="val">35,448.5 ops/ms</text>
  <text x="250" y="324" class="label">Crossbeam ArrayQueue</text>
  <text x="250" y="336" class="label-desc">Rust • Bounded (4P:4C)</text>
  <rect x="265" y="310" width="129.3" height="28" rx="5" fill="url(#grad-alt)"   />
  <text x="404.3" y="328" class="val">12,071.3 ops/ms</text>
  <text x="250" y="370" class="label">Nim system/Channel</text>
  <text x="250" y="382" class="label-desc">Nim Stdlib • Blocking channel (4P:4C)</text>
  <rect x="265" y="356" width="19.7" height="28" rx="5" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.8" />
  <text x="294.7" y="374" class="val">1,842.9 ops/ms</text>
</svg>