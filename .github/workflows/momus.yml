name: Momus

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

jobs:
  call:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: axiomantic/.github/.github/workflows/momus.yml@devel
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
      event_name: ${{ github.event_name }}
      trigger_command: /ai-review
      trigger_mention: "@axiomantic-momus[bot]"
      # Override the reusable workflow's deepseek default. deepseek-v4-pro
      # hit phase2 provider errors (finish_reason: error and Upstream idle
      # timeout exceeded) on PR-sized diffs. Three Anthropic slugs were
      # attempted via OpenRouter (claude-3.5-sonnet, claude-sonnet-latest,
      # claude-3.7-sonnet) and all rejected with 404 No-endpoints-found —
      # the account does not currently route Anthropic. Pivoting to
      # OpenAI gpt-4o: broadly accessible on OpenRouter, 128K context
      # headroom, strong code-reasoning consistency. Same LLM_API_KEY,
      # same base URL.
      model: openai/gpt-4o
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MOMUS_APP_ID: ${{ secrets.MOMUS_APP_ID }}
      MOMUS_APP_PRIVATE_KEY: ${{ secrets.MOMUS_APP_PRIVATE_KEY }}
