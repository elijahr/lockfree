name: Momus

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

jobs:
  call:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: axiomantic/.github/.github/workflows/momus.yml@devel
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
      event_name: ${{ github.event_name }}
      trigger_command: /ai-review
      trigger_mention: "@axiomantic-momus[bot]"
      # Override the reusable workflow's deepseek default. deepseek-v4-pro
      # hit phase2 provider errors (finish_reason: error and Upstream idle
      # timeout exceeded) on PR-sized diffs; Claude Sonnet has the context
      # headroom and reasoning consistency to clear phase2 on multi-commit
      # reviews. Using the floating `claude-sonnet-latest` alias on
      # OpenRouter so we always track the newest Sonnet without pin churn.
      # Same LLM_API_KEY (OpenRouter), same base URL.
      model: anthropic/claude-sonnet-latest
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MOMUS_APP_ID: ${{ secrets.MOMUS_APP_ID }}
      MOMUS_APP_PRIVATE_KEY: ${{ secrets.MOMUS_APP_PRIVATE_KEY }}
