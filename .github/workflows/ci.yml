# yamllint disable rule:line-length
#
# ci.yml — tiered CI workflow per docs/internal/2026-06-08-ci-resource-audit.md
# §4 (Tier A / Tier C) and design §6.3 cell catalog.
#
# Design cite: docs/internal/2026-06-05-umbrella-v0.1.0-design.md §6.3.
# Impl plan:   docs/internal/2026-06-06-umbrella-v0.1.0-impl-plan.md
#              T-CI-MATRIX (PG-10).
# Audit:       docs/internal/2026-06-08-ci-resource-audit.md
#              (per-push GHA-minute budget; tier assignments).
#
# Tier A — runs on every push AND on every pull_request (always-on):
#   L   Lint                                ubuntu-latest stable                   (typestates verify)
#  1a   Baseline orc                        ubuntu-latest stable      orc   gcc    LFQ_TEST_VARIANT=orc  (+ nimble examples)
#  1b   Baseline cpp                        ubuntu-latest stable      orc   gcc    LFQ_TEST_VARIANT=cpp  (nim cpp backend)
#  1c   Baseline arc + nebr aggregator      ubuntu-latest stable      arc   gcc    LFQ_TEST_VARIANT=arc
#  1d   Baseline refc                       ubuntu-latest stable      refc  gcc    LFQ_TEST_VARIANT=refc
#  12   chronos Tier 3 adapter              ubuntu-latest stable      arc   gcc   -d:lockfreeChronos
#  15   stress (100k bounded, orc+arc)      ubuntu-latest stable      orc+arc gcc  testStress task (not in umbrella)
#  13   Multi-Nim (2.2.10, 2.2.12, devel)   ubuntu-latest multi-ver   orc   gcc   single-runner toolchain switching
#  14   nimony aufbruch (informational)     ubuntu-latest nimony      arc   gcc   continue-on-error: true (pinned SHA + actions/cache@v4)
#
# Tier C — runs ONLY on push to main/devel (post-merge gate, skipped on PR triggers):
#   6   TSAN                                ubuntu-latest stable      orc   gcc   SANITIZE_THREADS=yes
#   7   ASAN                                ubuntu-latest stable      orc   gcc   SANITIZE_ADDRESS=yes
#   8   Valgrind memcheck (subset)          ubuntu-latest stable      orc   gcc
#   9   Helgrind (subset)                   ubuntu-latest stable      orc   gcc
#  10   Linux arm64                         ubuntu-24.04-arm stable   orc   gcc
#  11   macOS arm64                         macos-latest stable       orc   clang
#  17a  Windows + MSVC                      windows-latest stable     orc   vcc    LFQ_CC=vcc
#  17b  Windows + MinGW                     windows-latest stable     orc   gcc    LFQ_CC=gcc
#
# Deleted cells (per audit §3 green-mirage analysis):
#   2 (arc), 3 (refc), 4 (atomicArc), 5 (mm:none) — `LOCKFREE_MM` env var
#       is never consumed by lockfree.nimble or any source; these cells
#       produced signal identical to cell 1.
#  18 (nim cpp) — already covered by cell 1's inner `nim cpp` exec inside
#       the nimble test task.
#
# Resolved Open Questions (§6.13, all RESOLVED 2026-06-06):
#   O1  Wall-clock thresholds: GREEN <=20m / YELLOW 20-30m / RED >30m.
#   O4  Windows IN  (cells 17a MSVC + 17b MinGW, orc, sanitizers omitted).
#   O5  nim cpp IN  (covered by cell 1 inner exec; standalone cell 18 retired).
#   O8  Lint is Linux-only (one cell, OS-independent).
#   O9  actions/cache@v4 keyed on lockfree.nimble + nimble.lock.
#   O10 No macOS x86_64 (v0.2 backlog).
#
# Inherited from the retired build.yml (preserved load-bearing patterns):
#   - typestates v0.12.0 srcDir flattening workaround (self-referential
#     `src` symlink inside the pkg dir).
#   - nimble v0.20.x exit-code workaround (`nimble_run` wrapper greps
#     stdout for `Error:` and forces non-zero exit when nimble exits 0
#     after an inner exec abort).

name: ci

# yamllint disable rule:truthy
on:
  pull_request:
    paths-ignore:
      - '*.md'
  push:
    paths-ignore:
      - '*.md'
  workflow_dispatch:
# yamllint enable rule:truthy

# Cancel superseded runs on the same ref so a force-push or rapid
# successive pushes don't burn matrix-minutes on stale revisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Pin every `run:` step's shell to bash. Real GHA's hosted runners default
# to bash for `run:` steps, so workflows that use bash-isms (`set -o
# pipefail`, process substitution, etc.) work without a per-step `shell:`
# declaration. Act defaults to `sh -e` (which on Ubuntu is dash) — dash
# rejects `set -o pipefail` with `Illegal option -o pipefail`. Without
# this default, every script using bash-isms would need an explicit
# `shell: bash` and the workflow would behave differently under act vs
# GHA. One-line at workflow root pins them everywhere.
defaults:
  run:
    shell: bash

jobs:

  # ===========================================================================
  # Cell L — Lint (typestates verify + nph --check). Linux only per §6 O8.
  # Tier A: always on.
  # ===========================================================================
  lint:
    name: 'L: Lint (typestates verify)'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/elijahr/lockfree-ci:latest
    env:
      LOCKFREE_NIM_FROM_IMAGE: 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}
          restore-keys: |
            nimble-${{ runner.os }}-stable-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-stable-base-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-stable-base-

      - name: Install dependencies from nimble registry
        run: |
          nimble install -dy
          nimble setup
          # typestates v0.12.0 srcDir flattening workaround.
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Install typestates CLI binary
        # `nimble install -dy` above resolves typestates as a *dependency*
        # (-d = deps only), which does NOT build the package's binary.
        # typestates is a binary package (namedBin maps src/typestates_bin
        # to the `typestates` executable), so install it without -d to
        # build the CLI and drop it in ~/.nimble/bin (already on PATH in
        # the image). Symlink into /usr/local/bin too, so the verify step
        # resolves the binary regardless of the exec context's PATH (same
        # rationale as the nim/nimble symlinks in the image).
        run: |
          nimble install -y 'typestates@0.12.0'
          ln -sf ~/.nimble/bin/typestates /usr/local/bin/typestates
          typestates --help >/dev/null 2>&1 || true
          command -v typestates

      - name: Typestates verify
        run: typestates verify -W --format=github src/

  # ===========================================================================
  # Tier A — test-fast matrix.
  #
  # Cell 1 was originally a single cell whose `nimble test` ran orc/cpp/arc/refc
  # sequentially — wall clock = sum of all four lanes (~28 min). Split into
  # 1a/1b/1c/1d so each MM lane runs in its own parallel matrix cell; wall
  # clock now collapses to max-of-lanes (~7 min cold). LFQ_TEST_VARIANT
  # selects which lane each cell runs.
  # Chronos (12) is cheap; Multi-Nim (13) consolidates multiple compilers; nimony (14) is informational
  # but kept on every push so upstream-breakage badges stay current.
  #
  # Standalone-job-shaped Tier-A cells (chronos, nimony) live below as
  # separate jobs because their preflight/test-runner shape diverges.
  # ===========================================================================
  test-fast:
    name: '${{ matrix.cell }}: ${{ matrix.label }}'
    runs-on: ${{ matrix.runs-on }}
    container:
      image: ghcr.io/elijahr/lockfree-ci:latest
    env:
      LOCKFREE_NIM_FROM_IMAGE: 'true'
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.continue-on-error == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Cell 1a/1b/1c/1d: Baseline matrix --------------------------------
          # Previously cell 1 ran orc/cpp/arc/refc sequentially inside one
          # `nimble test` invocation; wall clock = sum of all four lanes
          # (~28 min). Splitting each MM lane into its own matrix cell lets
          # GHA run them in parallel — wall clock now collapses to
          # max-of-lanes (~7 min cold, faster warm). Each cell sets
          # LFQ_TEST_VARIANT so `nimble test` only executes its assigned
          # lane, and each cell uses a per-variant `cache-tag` so cells
          # don't clobber each other's nimcache state. Cell 1a (orc) also
          # runs `nimble examples` — examples have no MM variants, so
          # only one cell needs to cover them.
          - cell: '1a'
            label: 'baseline orc/gcc/linux'
            runs-on: ubuntu-latest
            nim-version: 'stable'
            variant: 'orc'
            mm: 'orc'
            backend: 'c'
            sanitize-threads: 'no'
            sanitize-address: 'no'
            cache-tag: 'orc'
            continue-on-error: 'false'
            timeout: 30

          - cell: '1b'
            label: 'baseline cpp/gcc/linux'
            runs-on: ubuntu-latest
            nim-version: 'stable'
            variant: 'cpp'
            mm: 'orc'
            backend: 'cpp'
            sanitize-threads: 'no'
            sanitize-address: 'no'
            cache-tag: 'cpp'
            continue-on-error: 'false'
            timeout: 30

          - cell: '1c'
            label: 'baseline arc/gcc/linux + nebr aggregator'
            runs-on: ubuntu-latest
            nim-version: 'stable'
            variant: 'arc'
            mm: 'arc'
            backend: 'c'
            sanitize-threads: 'no'
            sanitize-address: 'no'
            cache-tag: 'arc'
            continue-on-error: 'false'
            timeout: 30

          - cell: '1d'
            label: 'baseline refc/gcc/linux'
            runs-on: ubuntu-latest
            nim-version: 'stable'
            variant: 'refc'
            mm: 'refc'
            backend: 'c'
            sanitize-threads: 'no'
            sanitize-address: 'no'
            cache-tag: 'refc'
            continue-on-error: 'false'
            timeout: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}
          restore-keys: |
            nimble-${{ runner.os }}-stable-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-stable-${{ matrix.cache-tag }}-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-stable-${{ matrix.cache-tag }}-
            nimcache-${{ runner.os }}-stable-

      # Tier A is container-only (LOCKFREE_NIM_FROM_IMAGE='true' at job level),
      # so this step is a no-op here. Kept as a safety net in case the matrix
      # ever grows a non-container Linux cell.
      - name: Install clang (Linux, non-container)
        if: runner.os == 'Linux' && env.LOCKFREE_NIM_FROM_IMAGE != 'true'
        run: |
          sudo apt-get update -q -y
          sudo apt-get -qq install -y clang

      - name: Install dependencies from nimble registry
        run: |
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Run tests
        env:
          LFQ_TEST_VARIANT: ${{ matrix.variant }}
        run: |
          set -o pipefail
          export SANITIZE_THREADS=${{ matrix.sanitize-threads }}
          export SANITIZE_ADDRESS=${{ matrix.sanitize-address }}
          # Workaround for nimble v0.20.x: `nimble <task>` exits 0 even when
          # an inner `exec` aborts the script (it logs `Error:` but does not
          # propagate the failure). Tee output and grep for nimble's error
          # markers to force a non-zero exit.
          nimble_run() {
            local logfile
            logfile="$(mktemp)"
            "$@" 2>&1 | tee "$logfile"
            local rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              return $rc
            fi
            if grep -Eq '^[[:space:]]*Error:' "$logfile"; then
              echo "::error::nimble reported an error but exited 0; failing the step."
              return 1
            fi
          }
          echo "::group::Run test suite (variant=${LFQ_TEST_VARIANT})"
          nimble_run nimble test
          echo "::endgroup::"

      - name: Run examples
        # Examples have no MM variants, so we only need to run them once
        # across the test-fast matrix. Gate to the orc lane (cell 1a) —
        # running examples on every variant cell would burn ~3 min/cell × 4 cells
        # with no added signal.
        if: matrix.variant == 'orc'
        run: |
          set -o pipefail
          nimble_run() {
            local logfile
            logfile="$(mktemp)"
            "$@" 2>&1 | tee "$logfile"
            local rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              return $rc
            fi
            if grep -Eq '^[[:space:]]*Error:' "$logfile"; then
              echo "::error::nimble reported an error but exited 0; failing the step."
              return 1
            fi
          }
          echo "::group::Run examples"
          nimble_run nimble examples
          echo "::endgroup::"

  # ===========================================================================
  # Cell 13 — Multi-Nim toolchain consolidation (2.2.10, 2.2.12, devel).
  #
  # Tier A: runs on every push and pull_request.
  # Consolidates testing across multiple Nim compiler versions into a single
  # job runner using vfox toolchain switching (cached toolchain paths) to
  # eliminate redundant VM spin-up, checkout, and cache overhead across
  # separate matrix jobs.
  # ===========================================================================
  multi-nim:
    name: '13: Multi-Nim (2.2.10, 2.2.12, devel)'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Nim via vfox-nim
        uses: elijahr/vfox-nim@main
        with:
          version: '2.2.10'

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-multinim-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}
          restore-keys: |
            nimble-${{ runner.os }}-multinim-
            nimble-${{ runner.os }}-stable-

      - name: Cache vfox toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.version-fox/cache/nim
            ~/.vfox/cache/nim
          key: vfox-${{ runner.os }}-multinim-2.2.10-2.2.12-devel-${{ hashFiles('lockfree.nimble') }}
          restore-keys: |
            vfox-${{ runner.os }}-multinim-
            vfox-${{ runner.os }}-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-multinim-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-multinim-

      - name: Install dependencies from nimble registry
        shell: bash
        run: |
          export PATH="$HOME/.nimble/bin:$PATH"
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Test across multiple Nim versions (2.2.10, 2.2.12, devel)
        env:
          LFQ_TEST_VARIANT: orc
        shell: bash
        run: |
          set -o pipefail
          export PATH="$HOME/.nimble/bin:$PATH"

          nimble_run() {
            local logfile
            logfile="$(mktemp)"
            "$@" 2>&1 | tee "$logfile"
            local rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              return $rc
            fi
            if grep -Eq '^[[:space:]]*Error:' "$logfile"; then
              echo "::error::nimble reported an error but exited 0; failing the step."
              return 1
            fi
          }

          switch_toolchain() {
            local ver="$1"
            echo "::group::Switching toolchain to Nim ${ver}"
            local target="$ver"
            if [[ "$ver" == "devel" ]]; then
              target="ref:devel"
            fi
            vfox install --yes "nim@${target}" || true
            local bin_dir=""
            for search_dir in "$HOME/.version-fox" "$HOME/.vfox"; do
              if [ -d "$search_dir/cache/nim" ]; then
                for candidate in $(find "$search_dir/cache/nim" -type f -name nim 2>/dev/null); do
                  if [[ "$candidate" == *"$ver"* ]]; then
                    bin_dir="$(dirname "$candidate")"
                    break 2
                  fi
                done
              fi
            done
            if [ -n "$bin_dir" ]; then
              export PATH="$bin_dir:$PATH"
            fi
            echo "Active compiler: $(nim --version | head -1)"
            echo "Active nimble:   $(nimble --version | head -1)"
            echo "::endgroup::"
          }

          VERSIONS=("2.2.10" "2.2.12" "devel")
          FAILED_STABLE=0
          FAILED_DEVEL=0

          for ver in "${VERSIONS[@]}"; do
            switch_toolchain "$ver"
            echo "::group::Running test suite under Nim ${ver}"
            rm -rf ~/.cache/nim
            nimble setup
            for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
              [ -e "$d/src" ] || ln -s . "$d/src"
            done

            export LFQ_TEST_VARIANT=orc
            if nimble_run nimble test; then
              echo "✅ Nim ${ver} test suite passed."
            else
              if [[ "$ver" == "devel" ]]; then
                echo "::warning::Nim devel test suite failed (informational / upstream tracking)."
                FAILED_DEVEL=1
              else
                echo "::error::Nim ${ver} test suite failed!"
                FAILED_STABLE=1
              fi
            fi
            echo "::endgroup::"
          done

          if [[ $FAILED_STABLE -ne 0 ]]; then
            echo "::error::One or more release versions of Nim failed tests."
            exit 1
          fi

  # ===========================================================================
  # Cell 12 — chronos Tier 3 adapter (-d:lockfreeChronos). Tier A.
  # ===========================================================================
  chronos:
    name: '12: chronos Tier 3 adapter'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/elijahr/lockfree-ci:latest
    env:
      LOCKFREE_NIM_FROM_IMAGE: 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}-chronos
          restore-keys: |
            nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}-
            nimble-${{ runner.os }}-stable-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-stable-chronos-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-stable-chronos-
            nimcache-${{ runner.os }}-stable-base-

      - name: Install dependencies + chronos
        # CRITICAL #4 preservation: chronos is NOT in lockfree.nimble's
        # default `requires` — the Tier 3 adapter must compile/run without
        # chronos for the rest of the matrix (chronos is gated behind the
        # `-d:lockfreeChronos` define in lockfree.nimble). We install
        # chronos here at the CI step only, pinned to the SAME range the
        # nimble file declares under the define (>= 4.0.0 & < 5.0.0) so CI
        # never silently pulls a chronos 5.x the adapter is not declared
        # to support.
        run: |
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done
          nimble install -y 'chronos@>= 4.0.0 & < 5.0.0'

      - name: Compile + run with -d:lockfreeChronos
        run: |
          set -o pipefail
          echo "::group::chronos adapter (-d:lockfreeChronos, mm:arc)"
          nim c \
            --threads:on \
            --mm:arc \
            -d:lockfreeChronos \
            -r \
            tests/t_chronos.nim
          echo "::endgroup::"

  # ===========================================================================
  # Cell 15 — high-volume stress suite (100k bounded). Tier A.
  # ===========================================================================
  # tests/t_stress.nim is NOT imported by the umbrella (tests/test.nim): a
  # 100k x many-types run on every umbrella lane would dominate wall-clock.
  # This dedicated cell runs the `testStress` nimble task (orc + arc lanes)
  # so the high-volume ring-buffer collision coverage actually executes in
  # CI instead of sitting orphaned.
  stress:
    name: '15: stress (100k bounded, orc+arc)'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/elijahr/lockfree-ci:latest
    env:
      LOCKFREE_NIM_FROM_IMAGE: 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}-stress
          restore-keys: |
            nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}-
            nimble-${{ runner.os }}-stable-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-stable-stress-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-stable-stress-
            nimcache-${{ runner.os }}-stable-base-

      - name: Install dependencies
        run: |
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Run stress suite (orc + arc)
        run: |
          set -o pipefail
          echo "::group::testStress (100k bounded, orc + arc)"
          nimble testStress
          echo "::endgroup::"

  # ===========================================================================
  # Cell 14 — nimony aufbruch (informational, continue-on-error: true). Tier A.
  # ===========================================================================
  nimony:
    name: '14: nimony aufbruch (informational)'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Nim stable (2.2.10)
        uses: elijahr/vfox-nim@main
        with:
          version: '2.2.10'

      - name: Install Nimony nightly via vfox
        run: |
          vfox install --yes nim@nimony
          for search_dir in "$HOME/.version-fox" "$HOME/.vfox"; do
            if [ -d "$search_dir/cache/nim" ]; then
              nimony_bin="$(find "$search_dir/cache/nim" -type f -name nimony 2>/dev/null | head -n 1)"
              if [ -n "$nimony_bin" ]; then
                bin_dir="$(dirname "$nimony_bin")"
                echo "$bin_dir" >> "$GITHUB_PATH"
                echo "Added Nimony directory to GITHUB_PATH: $bin_dir"
                break
              fi
            fi
          done

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}
          restore-keys: |
            nimble-${{ runner.os }}-stable-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-stable-nimony-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-stable-nimony-
            nimcache-${{ runner.os }}-stable-base-

      - name: Install dependencies from nimble registry
        run: |
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Run non-nimony ARC baseline under standard Nim
        shell: bash
        run: |
          set -o pipefail
          echo "::group::standard Nim arc baseline"
          nim c \
            --threads:on \
            --mm:arc \
            --path:src \
            -r \
            tests/nimony/t_nimony_arc_baseline.nim
          echo "::endgroup::"

      - name: Run aufbruch baseline under nimony
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          echo "::group::nimony aufbruch baseline"
          NIMONY_BIN="$(command -v nimony 2>/dev/null || find "$HOME/.version-fox/cache/nim" "$HOME/.vfox/cache/nim" -type f -name nimony 2>/dev/null | head -n 1)"
          if [ -n "$NIMONY_BIN" ] && [ -x "$NIMONY_BIN" ]; then
            echo "Using nimony binary at: $NIMONY_BIN"
            "$NIMONY_BIN" c -r tests/nimony/t_nimony_arc_baseline.nim || echo "::warning::nimony test run exited with non-zero (informational)"
          else
            echo "::error::nimony binary not found or not executable"
            exit 1
          fi
          echo "::endgroup::"

  # ===========================================================================
  # Tier C — test-heavy matrix.
  #
  # Gated to push events on main/devel only (skipped on pull_request
  # triggers and skipped on direct pushes to feature branches). The
  # heavy-cell set is what bench.yml already restricts post-push-7;
  # mirror the same gate so feature-branch iteration stays cheap and the
  # heavy cells fire when work lands on the release branches.
  #
  # The matrix carries cells 6 (TSAN), 7 (ASAN), 10 (Linux arm64),
  # 11 (macOS arm64), 17a (Windows MSVC), 17b (Windows MinGW).
  # ===========================================================================
  test-heavy:
    name: '${{ matrix.cell }}: ${{ matrix.label }}'
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')) || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runs-on }}
    # Per-cell container: Linux cells (6, 7, 10) inherit the multi-arch
    # lockfree-ci image (Nim 2.2.10 stable + all build tools); macOS (11)
    # and Windows (17a/17b) cannot use a Linux container so their entries omit
    # the `container` key. GHA treats a null/missing `container` value as
    # "run directly on the runner".
    container: ${{ matrix.container }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      LOCKFREE_NIM_FROM_IMAGE: ${{ matrix.nim-from-image }}
      # Platform cells (10 arm64, 11 macOS, 17a/17b Windows) give PLATFORM coverage
      # on the default MM only; the full orc/cpp/arc/refc matrix is already
      # covered by the fast Linux baseline cells (1a-d). Without this, their
      # `nimble test` compiled all four lanes cold and overran the timeout.
      # Cells 6/7 use the dedicated testTSan/testASan tasks and ignore it.
      LFQ_TEST_VARIANT: ${{ matrix.mm }}
      LFQ_CC: ${{ matrix.compiler || '' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Cell 6: TSAN on baseline lane ---------------------------------
          - cell: '6'
            label: 'TSAN orc/gcc'
            runs-on: ubuntu-latest
            container:
              image: ghcr.io/elijahr/lockfree-ci:latest
            nim-from-image: 'true'
            nim-version: 'stable'
            mm: 'orc'
            backend: 'c'
            sanitize-threads: 'yes'
            sanitize-address: 'no'
            cache-tag: 'tsan'
            timeout: 45

          # --- Cell 7: ASAN on baseline lane ---------------------------------
          - cell: '7'
            label: 'ASAN orc/gcc'
            runs-on: ubuntu-latest
            container:
              image: ghcr.io/elijahr/lockfree-ci:latest
            nim-from-image: 'true'
            nim-version: 'stable'
            mm: 'orc'
            backend: 'c'
            sanitize-threads: 'no'
            sanitize-address: 'yes'
            cache-tag: 'asan'
            timeout: 45

          # --- Cell 10: Linux arm64 ------------------------------------------
          - cell: '10'
            label: 'arm64 linux'
            runs-on: ubuntu-24.04-arm
            container:
              image: ghcr.io/elijahr/lockfree-ci:latest
            nim-from-image: 'true'
            nim-version: 'stable'
            mm: 'orc'
            backend: 'c'
            sanitize-threads: 'no'
            sanitize-address: 'no'
            cache-tag: 'base'
            timeout: 45

          # --- Cell 11: macOS arm64 (Apple Silicon + Apple Clang) ------------
          # No container: macOS runner cannot host a Linux container.
          - cell: '11'
            label: 'macOS arm64'
            runs-on: macos-latest
            nim-from-image: 'false'
            nim-version: 'stable'
            mm: 'orc'
            backend: 'c'
            sanitize-threads: 'no'
            sanitize-address: 'no'
            cache-tag: 'base'
            timeout: 45

          # --- Cell 17a: Windows + MSVC (vcc) + orc --------------------------
          # No container: Windows runner cannot host a Linux container.
          # Exercises MSVC _InterlockedCompareExchange128 64-bit DWCAS and <intrin.h>.
          - cell: '17a'
            label: 'windows MSVC orc'
            runs-on: windows-latest
            compiler: 'vcc'
            nim-from-image: 'false'
            nim-version: 'stable'
            mm: 'orc'
            backend: 'c'
            sanitize-threads: 'no'
            sanitize-address: 'no'
            cache-tag: 'msvc'
            timeout: 45

          # --- Cell 17b: Windows + MinGW GCC + orc ---------------------------
          # No container: Windows runner cannot host a Linux container.
          # Exercises MinGW GCC __sync_val_compare_and_swap on __int128 (cmpxchg16b with -mcx16).
          - cell: '17b'
            label: 'windows MinGW gcc orc'
            runs-on: windows-latest
            compiler: 'gcc'
            nim-from-image: 'false'
            nim-version: 'stable'
            mm: 'orc'
            backend: 'c'
            sanitize-threads: 'no'
            sanitize-address: 'no'
            cache-tag: 'mingw'
            timeout: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      # Nim provisioning, split by runner type:
      #   - Linux cells in the lockfree-ci container: image ships Nim
      #     2.2.10 stable, no action needed.
      #   - macOS (cell 11): install vfox, add the elijahr/vfox-nim
      #     plugin (pinned to a commit SHA via zipball), install Nim
      #     2.2.10. Mirrors the Linux image's vfox flow.
      #   - Windows (cell 17): same vfox + vfox-nim flow as macOS, run
      #     under Git Bash (shell: bash). vfox-nim ships Windows
      #     official prebuilt binaries.

      - name: Setup Nim via vfox
        if: matrix.nim-from-image != 'true'
        uses: elijahr/vfox-nim@main
        with:
          nim-version: '2.2.10'

      - name: Setup MSVC developer command prompt (Windows)
        if: runner.os == 'Windows' && matrix.compiler == 'vcc'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Setup MinGW GCC (Windows)
        if: runner.os == 'Windows' && matrix.compiler == 'gcc'
        shell: bash
        run: |
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"
          echo "C:\msys64\usr\bin" >> "$GITHUB_PATH"

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-${{ matrix.nim-version }}-${{ matrix.compiler || 'default' }}-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}
          restore-keys: |
            nimble-${{ runner.os }}-${{ matrix.nim-version }}-${{ matrix.compiler || 'default' }}-
            nimble-${{ runner.os }}-${{ matrix.nim-version }}-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-${{ matrix.nim-version }}-${{ matrix.cache-tag }}-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-${{ matrix.nim-version }}-${{ matrix.cache-tag }}-
            nimcache-${{ runner.os }}-${{ matrix.nim-version }}-base-

      # Image already ships clang; only install on non-container Linux runs.
      - name: Install clang (Linux, non-container)
        if: runner.os == 'Linux' && matrix.nim-from-image != 'true'
        run: |
          sudo apt-get update -q -y
          sudo apt-get -qq install -y clang

      - name: Install dependencies from nimble registry (POSIX)
        if: runner.os != 'Windows'
        run: |
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Install dependencies from nimble registry (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          nimble install -dy
          nimble setup
          # typestates v0.12.0 srcDir flattening workaround (Windows variant).
          # The POSIX cells symlink `src -> .`; Git-Bash on Windows cannot
          # follow that self-referential link (it loops -> "Too many levels
          # of symbolic links"), so materialize a real src/ dir mirroring the
          # package contents instead.
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] && continue
            mkdir "$d/src"
            for f in "$d"/*; do
              case "$f" in
                */src) ;;
                *) cp -r -- "$f" "$d/src/" ;;
              esac
            done
          done

      - name: Run tests (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          nimble_run() {
            local logfile
            logfile="$(mktemp)"
            "$@" 2>&1 | tee "$logfile"
            local rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              return $rc
            fi
            if grep -Eq '^[[:space:]]*Error:' "$logfile"; then
              echo "::error::nimble reported an error but exited 0; failing the step."
              return 1
            fi
          }
          # Cell 6 (TSAN) and cell 7 (ASAN) invoke dedicated sanitizer
          # tasks added in lockfree.nimble; the env-var-gated path was
          # retired in v0.1.0 Batch 1. Other test-heavy cells (10/11)
          # run the standard nimble test matrix unchanged.
          case "${{ matrix.cell }}" in
            6)
              echo "::group::Run test suite under TSAN (mm=${{ matrix.mm }}, backend=${{ matrix.backend }})"
              nimble_run nimble testTSan
              echo "::endgroup::"
              ;;
            7)
              echo "::group::Run test suite under ASAN (mm=${{ matrix.mm }}, backend=${{ matrix.backend }})"
              nimble_run nimble testASan
              echo "::endgroup::"
              ;;
            *)
              echo "::group::Run test suite (mm=${{ matrix.mm }}, backend=${{ matrix.backend }})"
              nimble_run nimble test
              echo "::endgroup::"
              ;;
          esac
          echo "::group::Run examples"
          nimble_run nimble examples
          echo "::endgroup::"

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # Cell 17a (windows-latest + MSVC + orc) and Cell 17b (windows-latest + MinGW gcc + orc).
        # Sanitizers omitted on Windows per §6.3.
        run: |
          set -o pipefail
          nimble_run() {
            local logfile
            logfile="$(mktemp)"
            "$@" 2>&1 | tee "$logfile"
            local rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              return $rc
            fi
            if grep -Eq '^[[:space:]]*Error:' "$logfile"; then
              echo "::error::nimble reported an error but exited 0; failing the step."
              return 1
            fi
          }
          echo "::group::Compiler verification (${{ matrix.compiler }})"
          if [ "${{ matrix.compiler }}" = "vcc" ]; then
            which cl.exe || true
            cl.exe 2>&1 | head -n 2 || true
          elif [ "${{ matrix.compiler }}" = "gcc" ]; then
            which gcc.exe || true
            gcc.exe --version | head -n 1 || true
          fi
          echo "::endgroup::"

          echo "::group::Verify 64-bit DWCAS (128-bit atomics) on Windows"
          nim c --cc:${{ matrix.compiler }} --threads:on -r tests/t_dwcas.nim
          echo "::endgroup::"

          echo "::group::Run test suite on Windows (compiler=${{ matrix.compiler }}, mm=${{ matrix.mm }})"
          nimble_run nimble test
          echo "::endgroup::"

          echo "::group::Run examples on Windows"
          nimble_run nimble examples
          echo "::endgroup::"

  # ===========================================================================
  # Cell 8 — Valgrind memcheck (curated subset). Tier C.
  # ===========================================================================
  valgrind:
    name: '8: Valgrind memcheck (subset)'
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/elijahr/lockfree-ci:latest
    env:
      LOCKFREE_NIM_FROM_IMAGE: 'true'
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}
          restore-keys: |
            nimble-${{ runner.os }}-stable-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-stable-base-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-stable-base-

      # Image already ships valgrind; only install when running outside the
      # container (kept as a safety hatch if the container is ever removed).
      - name: Install Valgrind (non-container only)
        if: env.LOCKFREE_NIM_FROM_IMAGE != 'true'
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -y valgrind

      - name: Install dependencies from nimble registry
        run: |
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Run Valgrind memcheck on curated subset
        # Curated subset per §6.6.2 / docs/internal/ci-cells.md: covers
        # all four queue cardinalities (SPSC + MPSC + MPMC) and the two
        # highest-risk lifecycle surfaces (drain + destructor walk).
        run: |
          set -o pipefail
          SUBSET=(
            tests/t_drain.nim
            tests/t_destructor_walk.nim
            tests/t_queue_bounded_spsc.nim
            tests/t_queue_bounded_mpsc.nim
            tests/t_queue_bounded_mpmc.nim
          )
          for t in "${SUBSET[@]}"; do
            echo "::group::Valgrind memcheck: $t"
            bin="$(mktemp -u /tmp/valgrind_XXXXXX)"
            nim c \
              --threads:on \
              --mm:orc \
              --debugger:native \
              --opt:none \
              -d:useMalloc \
              -o:"$bin" \
              "$t"
            valgrind \
              --error-exitcode=1 \
              --leak-check=full \
              --show-leak-kinds=all \
              --errors-for-leak-kinds=definite,possible \
              --track-origins=yes \
              --suppressions=tests/valgrind-suppressions.supp \
              "$bin"
            rm -f "$bin"
            echo "::endgroup::"
          done

  # ===========================================================================
  # Cell 9 — Helgrind race detector (curated subset). Tier C.
  # ===========================================================================
  helgrind:
    name: '9: Helgrind (subset)'
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/elijahr/lockfree-ci:latest
    env:
      LOCKFREE_NIM_FROM_IMAGE: 'true'
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}
          restore-keys: |
            nimble-${{ runner.os }}-stable-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-stable-base-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-stable-base-

      # Image already ships valgrind (provides helgrind); only install when
      # running outside the container.
      - name: Install Valgrind (non-container only)
        if: env.LOCKFREE_NIM_FROM_IMAGE != 'true'
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -y valgrind

      - name: Install dependencies from nimble registry
        run: |
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Run Helgrind on curated subset
        run: |
          set -o pipefail
          SUBSET=(
            tests/t_queue_bounded_mpmc.nim
            tests/t_unbounded_mpmc.nim
            tests/smr/debra-legacy/t_nebr_retire.nim
          )
          for t in "${SUBSET[@]}"; do
            echo "::group::Helgrind: $t"
            bin="$(mktemp -u /tmp/helgrind_XXXXXX)"
            nim c \
              --threads:on \
              --mm:orc \
              --debugger:native \
              --opt:none \
              -d:useMalloc \
              -o:"$bin" \
              "$t"
            valgrind \
              --tool=helgrind \
              --error-exitcode=1 \
              "$bin"
            rm -f "$bin"
            echo "::endgroup::"
          done
