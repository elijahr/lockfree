# yamllint disable rule:line-length
#
# ci.yml — tiered CI workflow per docs/internal/2026-06-08-ci-resource-audit.md
# §4 (Tier A / Tier C) and design §6.3 cell catalog.
#
# Design cite: docs/internal/2026-06-05-umbrella-v0.1.0-design.md §6.3.
# Impl plan:   docs/internal/2026-06-06-umbrella-v0.1.0-impl-plan.md
#              T-CI-MATRIX (PG-10).
# Audit:       docs/internal/2026-06-08-ci-resource-audit.md
#              (per-push GHA-minute budget; tier assignments).
#
# Tier A — runs on every push AND on every pull_request (always-on):
#   L   Lint                                ubuntu-latest stable                   (typestates verify)
#   1   Baseline                            ubuntu-latest stable      orc   gcc    (the nimble test task runs orc/cpp/arc/refc internally — one cell covers the full MM matrix)
#  12   chronos Tier 3 adapter              ubuntu-latest stable      arc   gcc   -d:lockfreeChronos
#  13   nim devel (informational)           ubuntu-latest devel       orc   gcc   continue-on-error: true
#  14   nimony aufbruch (informational)     ubuntu-latest nimony      arc   gcc   continue-on-error: true (pinned SHA + actions/cache@v4)
#
# Tier C — runs ONLY on push to main/devel (post-merge gate, skipped on PR triggers):
#   6   TSAN                                ubuntu-latest stable      orc   gcc   SANITIZE_THREADS=yes
#   7   ASAN                                ubuntu-latest stable      orc   gcc   SANITIZE_ADDRESS=yes
#   8   Valgrind memcheck (subset)          ubuntu-latest stable      orc   gcc
#   9   Helgrind (subset)                   ubuntu-latest stable      orc   gcc
#  10   Linux arm64                         ubuntu-24.04-arm stable   orc   gcc
#  11   macOS arm64                         macos-latest stable       orc   clang
#  17   Windows + MSVC                      windows-latest stable     orc   MSVC
#
# Deleted cells (per audit §3 green-mirage analysis):
#   2 (arc), 3 (refc), 4 (atomicArc), 5 (mm:none) — `LOCKFREE_MM` env var
#       is never consumed by lockfree.nimble or any source; these cells
#       produced signal identical to cell 1.
#  18 (nim cpp) — already covered by cell 1's inner `nim cpp` exec inside
#       the nimble test task.
#
# Resolved Open Questions (§6.13, all RESOLVED 2026-06-06):
#   O1  Wall-clock thresholds: GREEN <=20m / YELLOW 20-30m / RED >30m.
#   O4  Windows IN  (cell 17, MSVC + orc, sanitizers omitted).
#   O5  nim cpp IN  (covered by cell 1 inner exec; standalone cell 18 retired).
#   O8  Lint is Linux-only (one cell, OS-independent).
#   O9  actions/cache@v4 keyed on lockfree.nimble + nimble.lock.
#   O10 No macOS x86_64 (v0.2 backlog).
#
# Inherited from the retired build.yml (preserved load-bearing patterns):
#   - typestates v0.12.0 srcDir flattening workaround (self-referential
#     `src` symlink inside the pkg dir).
#   - nimble v0.20.x exit-code workaround (`nimble_run` wrapper greps
#     stdout for `Error:` and forces non-zero exit when nimble exits 0
#     after an inner exec abort).

name: ci

# yamllint disable rule:truthy
on:
  pull_request:
    paths-ignore:
      - '*.md'
  push:
    paths-ignore:
      - '*.md'
# yamllint enable rule:truthy

# Cancel superseded runs on the same ref so a force-push or rapid
# successive pushes don't burn matrix-minutes on stale revisions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:

  # ===========================================================================
  # Cell L — Lint (typestates verify + nph --check). Linux only per §6 O8.
  # Tier A: always on.
  # ===========================================================================
  lint:
    name: 'L: Lint (typestates verify)'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/elijahr/lockfree-ci:latest
    env:
      LOCKFREE_NIM_FROM_IMAGE: 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}
          restore-keys: |
            nimble-${{ runner.os }}-stable-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-stable-base-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-stable-base-

      - name: Install dependencies from nimble registry
        run: |
          nimble install -dy
          nimble setup
          # typestates v0.12.0 srcDir flattening workaround.
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Typestates verify
        run: typestates verify -W --format=github src/

  # ===========================================================================
  # Tier A — test-fast matrix.
  #
  # Per audit §4: cell 1's `nimble test` already exercises orc/cpp/arc/refc
  # internally, so a single Linux baseline cell covers the MM matrix.
  # Chronos (12) is cheap; nim devel (13) and nimony (14) are informational
  # but kept on every push so upstream-breakage badges stay current.
  #
  # Standalone-job-shaped Tier-A cells (chronos, nimony) live below as
  # separate jobs because their preflight/test-runner shape diverges.
  # ===========================================================================
  test-fast:
    name: '${{ matrix.cell }}: ${{ matrix.label }}'
    runs-on: ${{ matrix.runs-on }}
    container:
      image: ghcr.io/elijahr/lockfree-ci:latest
    env:
      LOCKFREE_NIM_FROM_IMAGE: 'true'
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.continue-on-error == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Cell 1: Baseline (orc + gcc + Linux x86_64) -------------------
          # Keystone cell: `nimble test` runs all four MM lanes
          # (orc / cpp / arc / refc) plus the debra-legacy aggregator and
          # `nimble examples` inside this single cell.
          - cell: '1'
            label: 'baseline orc/gcc/linux'
            runs-on: ubuntu-latest
            nim-version: 'stable'
            mm: 'orc'
            backend: 'c'
            sanitize-threads: 'no'
            sanitize-address: 'no'
            cache-tag: 'base'
            continue-on-error: 'false'
            timeout: 45

          # --- Cell 13: Nim devel (informational) ----------------------------
          - cell: '13'
            label: 'nim devel (informational)'
            runs-on: ubuntu-latest
            nim-version: 'devel'
            mm: 'orc'
            backend: 'c'
            sanitize-threads: 'no'
            sanitize-address: 'no'
            cache-tag: 'base'
            continue-on-error: 'true'
            timeout: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      # Tier A runs inside the lockfree-ci container on Linux. Stable cells
      # (cell 1) use the Nim 2.2.10 toolchain the image already ships, so no
      # install step runs. Devel cells (cell 13) install Nim devel via the
      # container's preinstalled asdf + asdf-community/asdf-nim plugin —
      # `ref:devel` fetches the nightly devel build.
      - name: Install Nim devel via asdf (container)
        if: matrix.nim-version == 'devel'
        run: |
          /opt/asdf/bin/asdf install nim ref:devel
          /opt/asdf/bin/asdf global nim ref:devel
          ln -sf /opt/asdf/installs/nim/ref-devel/bin/nim /usr/local/bin/nim
          ln -sf /opt/asdf/installs/nim/ref-devel/bin/nimble /usr/local/bin/nimble
          nim --version | head -1
          nimble --version

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-${{ matrix.nim-version }}-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}
          restore-keys: |
            nimble-${{ runner.os }}-${{ matrix.nim-version }}-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-${{ matrix.nim-version }}-${{ matrix.cache-tag }}-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-${{ matrix.nim-version }}-${{ matrix.cache-tag }}-
            nimcache-${{ runner.os }}-${{ matrix.nim-version }}-base-

      # Tier A is container-only (LOCKFREE_NIM_FROM_IMAGE='true' at job level),
      # so this step is a no-op here. Kept as a safety net in case the matrix
      # ever grows a non-container Linux cell.
      - name: Install clang (Linux, non-container)
        if: runner.os == 'Linux' && env.LOCKFREE_NIM_FROM_IMAGE != 'true'
        run: |
          sudo apt-get update -q -y
          sudo apt-get -qq install -y clang

      - name: Install dependencies from nimble registry
        run: |
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Run tests
        run: |
          set -o pipefail
          export SANITIZE_THREADS=${{ matrix.sanitize-threads }}
          export SANITIZE_ADDRESS=${{ matrix.sanitize-address }}
          # Workaround for nimble v0.20.x: `nimble <task>` exits 0 even when
          # an inner `exec` aborts the script (it logs `Error:` but does not
          # propagate the failure). Tee output and grep for nimble's error
          # markers to force a non-zero exit.
          nimble_run() {
            local logfile
            logfile="$(mktemp)"
            "$@" 2>&1 | tee "$logfile"
            local rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              return $rc
            fi
            if grep -Eq '^[[:space:]]*Error:' "$logfile"; then
              echo "::error::nimble reported an error but exited 0; failing the step."
              return 1
            fi
          }
          echo "::group::Run test suite (nimble test covers orc/cpp/arc/refc internally)"
          nimble_run nimble test
          echo "::endgroup::"
          echo "::group::Run examples"
          nimble_run nimble examples
          echo "::endgroup::"

  # ===========================================================================
  # Cell 12 — chronos Tier 3 adapter (-d:lockfreeChronos). Tier A.
  # ===========================================================================
  chronos:
    name: '12: chronos Tier 3 adapter'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/elijahr/lockfree-ci:latest
    env:
      LOCKFREE_NIM_FROM_IMAGE: 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}-chronos
          restore-keys: |
            nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}-
            nimble-${{ runner.os }}-stable-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-stable-chronos-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-stable-chronos-
            nimcache-${{ runner.os }}-stable-base-

      - name: Install dependencies + chronos
        # CRITICAL #4 preservation: chronos is NOT in lockfree.nimble's
        # `requires` — Tier 3 adapter must compile/run without chronos
        # for the rest of the matrix. We install chronos here at the CI
        # step only, with the version pin per R3 (>= 4.0.0).
        run: |
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done
          nimble install -y 'chronos@>= 4.0.0'

      - name: Compile + run with -d:lockfreeChronos
        run: |
          set -o pipefail
          echo "::group::chronos adapter (-d:lockfreeChronos, mm:arc)"
          nim c \
            --threads:on \
            --mm:arc \
            -d:lockfreeChronos \
            -r \
            tests/t_chronos.nim
          echo "::endgroup::"

  # ===========================================================================
  # Cell 14 — nimony aufbruch (informational, continue-on-error: true). Tier A.
  # ===========================================================================
  nimony:
    name: '14: nimony aufbruch (informational)'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/elijahr/lockfree-ci:latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      # Pinned nimony commit SHA per §6 O3.
      NIMONY_SHA: '751121f9ee0fc7584015fc03f5326fe521029d84'
      LOCKFREE_NIM_FROM_IMAGE: 'true'
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}
          restore-keys: |
            nimble-${{ runner.os }}-stable-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-stable-nimony-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-stable-nimony-
            nimcache-${{ runner.os }}-stable-base-

      - name: Cache nimony build
        uses: actions/cache@v4
        id: nimony-cache
        with:
          path: |
            /tmp/nimony
            ~/.nimble/bin/nimony
          key: nimony-${{ runner.os }}-${{ env.NIMONY_SHA }}

      - name: Install dependencies from nimble registry
        run: |
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Build nimony from source (pinned SHA)
        if: steps.nimony-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          git clone https://github.com/nim-lang/nimony.git /tmp/nimony
          cd /tmp/nimony
          git checkout "${NIMONY_SHA}"
          nimble install -y

      - name: Run aufbruch baseline under nimony
        run: |
          set -o pipefail
          echo "::group::nimony aufbruch baseline"
          nim c \
            --threads:on \
            --mm:arc \
            -d:nimony \
            -r \
            tests/nimony/t_nimony_arc_baseline.nim
          echo "::endgroup::"

  # ===========================================================================
  # Tier C — test-heavy matrix.
  #
  # Gated to push events on main/devel only (skipped on pull_request
  # triggers and skipped on direct pushes to feature branches). The
  # heavy-cell set is what bench.yml already restricts post-push-7;
  # mirror the same gate so feature-branch iteration stays cheap and the
  # heavy cells fire when work lands on the release branches.
  #
  # The matrix carries cells 6 (TSAN), 7 (ASAN), 10 (Linux arm64),
  # 11 (macOS arm64), 17 (Windows MSVC).
  # ===========================================================================
  test-heavy:
    name: '${{ matrix.cell }}: ${{ matrix.label }}'
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')
    runs-on: ${{ matrix.runs-on }}
    # Per-cell container: Linux cells (6, 7, 10) inherit the multi-arch
    # lockfree-ci image (Nim 2.2.10 stable + all build tools); macOS (11)
    # and Windows (17) cannot use a Linux container so their entries omit
    # the `container` key. GHA treats a null/missing `container` value as
    # "run directly on the runner".
    container: ${{ matrix.container }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      LOCKFREE_NIM_FROM_IMAGE: ${{ matrix.nim-from-image }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Cell 6: TSAN on baseline lane ---------------------------------
          - cell: '6'
            label: 'TSAN orc/gcc'
            runs-on: ubuntu-latest
            container:
              image: ghcr.io/elijahr/lockfree-ci:latest
            nim-from-image: 'true'
            nim-version: 'stable'
            mm: 'orc'
            backend: 'c'
            sanitize-threads: 'yes'
            sanitize-address: 'no'
            cache-tag: 'tsan'
            timeout: 45

          # --- Cell 7: ASAN on baseline lane ---------------------------------
          - cell: '7'
            label: 'ASAN orc/gcc'
            runs-on: ubuntu-latest
            container:
              image: ghcr.io/elijahr/lockfree-ci:latest
            nim-from-image: 'true'
            nim-version: 'stable'
            mm: 'orc'
            backend: 'c'
            sanitize-threads: 'no'
            sanitize-address: 'yes'
            cache-tag: 'asan'
            timeout: 45

          # --- Cell 10: Linux arm64 ------------------------------------------
          - cell: '10'
            label: 'arm64 linux'
            runs-on: ubuntu-24.04-arm
            container:
              image: ghcr.io/elijahr/lockfree-ci:latest
            nim-from-image: 'true'
            nim-version: 'stable'
            mm: 'orc'
            backend: 'c'
            sanitize-threads: 'no'
            sanitize-address: 'no'
            cache-tag: 'base'
            timeout: 45

          # --- Cell 11: macOS arm64 (Apple Silicon + Apple Clang) ------------
          # No container: macOS runner cannot host a Linux container.
          - cell: '11'
            label: 'macOS arm64'
            runs-on: macos-latest
            nim-from-image: 'false'
            nim-version: 'stable'
            mm: 'orc'
            backend: 'c'
            sanitize-threads: 'no'
            sanitize-address: 'no'
            cache-tag: 'base'
            timeout: 45

          # --- Cell 17: Windows + MSVC + orc (per O4) ------------------------
          # No container: Windows runner cannot host a Linux container.
          - cell: '17'
            label: 'windows MSVC orc'
            runs-on: windows-latest
            nim-from-image: 'false'
            nim-version: 'stable'
            mm: 'orc'
            backend: 'c'
            sanitize-threads: 'no'
            sanitize-address: 'no'
            cache-tag: 'msvc'
            timeout: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      # Nim provisioning, split by runner type:
      #   - Linux cells in the lockfree-ci container: image ships Nim
      #     2.2.10 stable, no action needed.
      #   - macOS (cell 11): install Go-based asdf v0.19.0 directly, add
      #     the asdf-community/asdf-nim plugin, install Nim 2.2.10.
      #   - Windows (cell 17): the asdf-nim plugin is POSIX-only, so use
      #     nim-lang/setup-nimble-action to land nimble first, then
      #     `nimble install nim@2.2.10` to land Nim itself.

      - name: Install Nim via asdf (macOS)
        if: matrix.nim-from-image != 'true' && runner.os == 'macOS'
        env:
          ASDF_VERSION: 'v0.19.0'
          NIM_VERSION: '2.2.10'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          # Pick arm64 vs amd64 asdf tarball at runtime.
          arch="$(uname -m)"
          case "$arch" in
            arm64|aarch64) asdf_arch='arm64' ;;
            x86_64|amd64)  asdf_arch='amd64' ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          curl -fsSL \
            "https://github.com/asdf-vm/asdf/releases/download/${ASDF_VERSION}/asdf-${ASDF_VERSION}-darwin-${asdf_arch}.tar.gz" \
            -o /tmp/asdf.tar.gz
          tar -xzf /tmp/asdf.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/asdf"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.asdf/shims" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.asdf/shims:$PATH"
          asdf plugin add nim https://github.com/asdf-community/asdf-nim.git
          asdf install nim "$NIM_VERSION"
          asdf set --home nim "$NIM_VERSION"
          # asdf-nim installs to $ASDF_DATA_DIR/installs/nim/$NIM_VERSION/bin.
          # ASDF_DATA_DIR defaults to $HOME/.asdf.
          echo "$HOME/.asdf/installs/nim/${NIM_VERSION}/bin" >> "$GITHUB_PATH"
          "$HOME/.asdf/installs/nim/${NIM_VERSION}/bin/nim" --version | head -1
          "$HOME/.asdf/installs/nim/${NIM_VERSION}/bin/nimble" --version

      - name: Install nimble (Windows)
        if: matrix.nim-from-image != 'true' && runner.os == 'Windows'
        uses: nim-lang/setup-nimble-action@v1
        with:
          nimble-version: 'latest'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nim via nimble (Windows)
        if: matrix.nim-from-image != 'true' && runner.os == 'Windows'
        shell: bash
        env:
          NIM_VERSION: '2.2.10'
        run: |
          set -euo pipefail
          nimble install -y "nim@${NIM_VERSION}"
          # `nimble install nim@X` places nim.exe + nimble.exe in
          # ~/.nimble/bin (USERPROFILE/.nimble/bin on Windows).
          # GITHUB_PATH expects native paths on Windows.
          echo "${USERPROFILE}\\.nimble\\bin" >> "$GITHUB_PATH"
          "${USERPROFILE}/.nimble/bin/nim.exe" --version | head -1
          "${USERPROFILE}/.nimble/bin/nimble.exe" --version

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-${{ matrix.nim-version }}-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}
          restore-keys: |
            nimble-${{ runner.os }}-${{ matrix.nim-version }}-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-${{ matrix.nim-version }}-${{ matrix.cache-tag }}-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-${{ matrix.nim-version }}-${{ matrix.cache-tag }}-
            nimcache-${{ runner.os }}-${{ matrix.nim-version }}-base-

      # Image already ships clang; only install on non-container Linux runs.
      - name: Install clang (Linux, non-container)
        if: runner.os == 'Linux' && matrix.nim-from-image != 'true'
        run: |
          sudo apt-get update -q -y
          sudo apt-get -qq install -y clang

      - name: Install dependencies from nimble registry (POSIX)
        if: runner.os != 'Windows'
        run: |
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Install dependencies from nimble registry (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Run tests (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          export SANITIZE_THREADS=${{ matrix.sanitize-threads }}
          export SANITIZE_ADDRESS=${{ matrix.sanitize-address }}
          nimble_run() {
            local logfile
            logfile="$(mktemp)"
            "$@" 2>&1 | tee "$logfile"
            local rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              return $rc
            fi
            if grep -Eq '^[[:space:]]*Error:' "$logfile"; then
              echo "::error::nimble reported an error but exited 0; failing the step."
              return 1
            fi
          }
          echo "::group::Run test suite (mm=${{ matrix.mm }}, backend=${{ matrix.backend }})"
          nimble_run nimble test
          echo "::endgroup::"
          echo "::group::Run examples"
          nimble_run nimble examples
          echo "::endgroup::"

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # Cell 17 (windows-latest + MSVC + orc). MSVC's cl.exe is the
        # default `cc` for Nim on Windows; sanitizers omitted per §6.3.
        run: |
          set -o pipefail
          nimble_run() {
            local logfile
            logfile="$(mktemp)"
            "$@" 2>&1 | tee "$logfile"
            local rc=${PIPESTATUS[0]}
            if [[ $rc -ne 0 ]]; then
              return $rc
            fi
            if grep -Eq '^[[:space:]]*Error:' "$logfile"; then
              echo "::error::nimble reported an error but exited 0; failing the step."
              return 1
            fi
          }
          echo "::group::Run test suite on Windows (mm=${{ matrix.mm }})"
          nimble_run nimble test
          echo "::endgroup::"

  # ===========================================================================
  # Cell 8 — Valgrind memcheck (curated subset). Tier C.
  # ===========================================================================
  valgrind:
    name: '8: Valgrind memcheck (subset)'
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/elijahr/lockfree-ci:latest
    env:
      LOCKFREE_NIM_FROM_IMAGE: 'true'
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}
          restore-keys: |
            nimble-${{ runner.os }}-stable-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-stable-base-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-stable-base-

      # Image already ships valgrind; only install when running outside the
      # container (kept as a safety hatch if the container is ever removed).
      - name: Install Valgrind (non-container only)
        if: env.LOCKFREE_NIM_FROM_IMAGE != 'true'
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -y valgrind

      - name: Install dependencies from nimble registry
        run: |
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Run Valgrind memcheck on curated subset
        # Curated subset per §6.6.2 / docs/internal/ci-cells.md: covers
        # all four queue cardinalities (SPSC + MPSC + MPMC) and the two
        # highest-risk lifecycle surfaces (drain + destructor walk).
        run: |
          set -o pipefail
          SUBSET=(
            tests/t_drain.nim
            tests/t_destructor_walk.nim
            tests/t_queue_bounded_spsc.nim
            tests/t_queue_bounded_mpsc.nim
            tests/t_queue_bounded_mpmc.nim
          )
          for t in "${SUBSET[@]}"; do
            echo "::group::Valgrind memcheck: $t"
            bin="$(mktemp -u /tmp/valgrind_XXXXXX)"
            nim c \
              --threads:on \
              --mm:orc \
              --debugger:native \
              --opt:none \
              -d:useMalloc \
              -o:"$bin" \
              "$t"
            valgrind \
              --error-exitcode=1 \
              --leak-check=full \
              --show-leak-kinds=all \
              --errors-for-leak-kinds=definite,possible \
              --track-origins=yes \
              --suppressions=tests/valgrind-suppressions.supp \
              "$bin"
            rm -f "$bin"
            echo "::endgroup::"
          done

  # ===========================================================================
  # Cell 9 — Helgrind race detector (curated subset). Tier C.
  # ===========================================================================
  helgrind:
    name: '9: Helgrind (subset)'
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/elijahr/lockfree-ci:latest
    env:
      LOCKFREE_NIM_FROM_IMAGE: 'true'
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimble/pkgs2
            ~/.nimble/bin
          key: nimble-${{ runner.os }}-stable-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}
          restore-keys: |
            nimble-${{ runner.os }}-stable-

      - name: Cache Nim nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nim
          key: nimcache-${{ runner.os }}-stable-base-${{ hashFiles('src/**/*.nim', 'tests/**/*.nim', 'nim.cfg', 'config.nims', 'lockfree.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-stable-base-

      # Image already ships valgrind (provides helgrind); only install when
      # running outside the container.
      - name: Install Valgrind (non-container only)
        if: env.LOCKFREE_NIM_FROM_IMAGE != 'true'
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -y valgrind

      - name: Install dependencies from nimble registry
        run: |
          nimble install -dy
          nimble setup
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-0.12.0-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Run Helgrind on curated subset
        run: |
          set -o pipefail
          SUBSET=(
            tests/t_queue_bounded_mpmc.nim
            tests/t_unbounded_mpmc.nim
            tests/smr/debra-legacy/t_nebr_retire.nim
          )
          for t in "${SUBSET[@]}"; do
            echo "::group::Helgrind: $t"
            bin="$(mktemp -u /tmp/helgrind_XXXXXX)"
            nim c \
              --threads:on \
              --mm:orc \
              --debugger:native \
              --opt:none \
              -d:useMalloc \
              -o:"$bin" \
              "$t"
            valgrind \
              --tool=helgrind \
              --error-exitcode=1 \
              "$bin"
            rm -f "$bin"
            echo "::endgroup::"
          done
