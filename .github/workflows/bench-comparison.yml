# yamllint disable rule:line-length

name: bench-comparison

# yamllint disable rule:truthy
on:
  workflow_dispatch:
    inputs:
      # Per-adapter soft-skip overrides, mirroring bench.yml's
      # force_skip_* inputs. Empty string when unset (the default),
      # '1' when the operator forces a skip; the env block below maps
      # each input to a FORCE_SKIP_<LIB> env var that step-level `if:`
      # clauses gate on. v5.0.0 Bundle 5: extends the crossbeam-only
      # comparison job to the full external-adapter set.
      force_skip_atomic_queue:
        description: 'Force atomic_queue soft-skip'
        type: boolean
        default: false
      force_skip_rigtorp_spsc:
        description: 'Force rigtorp/SPSCQueue soft-skip'
        type: boolean
        default: false
      force_skip_rigtorp_mpmc:
        description: 'Force rigtorp/MPMCQueue soft-skip'
        type: boolean
        default: false
      force_skip_flume:
        description: 'Force flume soft-skip'
        type: boolean
        default: false
      force_skip_kanal:
        description: 'Force kanal soft-skip'
        type: boolean
        default: false
      force_skip_liblfds:
        description: 'Force liblfds soft-skip'
        type: boolean
        default: false
  schedule:
    # Nightly at 04:00 UTC. Off-peak so the runner pool is fresh; the
    # cdylib build adds ~30s vs the in-tree benches.
    - cron: '0 4 * * *'
  push:
    branches: [main, devel]
    paths:
      - 'benchmarks/rust/**'
      - 'benchmarks/vendor/**'
      - 'benchmarks/nim/adapters/**'
      - 'benchmarks/nim/smoke/**'
      - 'benchmarks/nim/bench_*.nim'
      - '.github/workflows/bench-comparison.yml'
# yamllint enable rule:truthy

# Cancel superseded runs on the same ref so a force-push or
# back-to-back operator dispatches don't burn cdylib+matrix minutes
# on stale revisions. Scoped per (workflow, ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always
  # v5.0.0 Bundle 5 soft-skip overrides. Empty string when the
  # workflow_dispatch input is unset (the default), '1' when the
  # operator forces a skip. Step-level `if:` clauses gate on these.
  # Crossbeam has no FORCE_SKIP toggle: it is the original comparison
  # adapter and its steps are not soft-skippable by design.
  FORCE_SKIP_ATOMIC_QUEUE: ${{ inputs.force_skip_atomic_queue && '1' || '' }}
  FORCE_SKIP_RIGTORP_SPSC: ${{ inputs.force_skip_rigtorp_spsc && '1' || '' }}
  FORCE_SKIP_RIGTORP_MPMC: ${{ inputs.force_skip_rigtorp_mpmc && '1' || '' }}
  FORCE_SKIP_FLUME: ${{ inputs.force_skip_flume && '1' || '' }}
  FORCE_SKIP_KANAL: ${{ inputs.force_skip_kanal && '1' || '' }}
  FORCE_SKIP_LIBLFDS: ${{ inputs.force_skip_liblfds && '1' || '' }}

jobs:
  bench-crossbeam:
    # Track 3 §3.13: Crossbeam-only comparison workflow.
    #
    # Crossbeam adds a Rust toolchain dependency (~5 min cold install),
    # which would inflate the bench.yml critical path on every PR. Per
    # design 2.6 / impl plan 3.13 it lives in this dedicated workflow,
    # gated on nightly cron + workflow_dispatch + targeted path pushes
    # to main / devel. Output flows into the merged BMF artifact consumed
    # by the docs charts.
    name: bench-crossbeam (ubuntu-22.04)
    # Pinned to ubuntu-22.04 (not ubuntu-latest) so bench wall-clock
    # numbers stay reproducible across runs — the GitHub-hosted ubuntu-
    # latest pointer rolls forward periodically (e.g., 22.04 -> 24.04)
    # and the resulting kernel/glibc/scheduler delta produces apparent
    # throughput shifts that have no relationship to a code change.
    # Mirrors bench.yml's identical pin.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ~/.cache
          # Mirrors build.yml / bench.yml: include the nimble manifest +
          # lockfile in the key so a dep bump invalidates the cache
          # instead of silently reusing a stale entry.
          key: cache-bench-comparison-${{ runner.os }}-${{ hashFiles('lockfree.nimble', 'nimble.lock') }}

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install build deps (Linux)
        run: |
          sudo apt-get update -q -y
          sudo apt-get -qq install -y clang

      - name: Install dependencies from nimble registry
        # Uses lockfree.nimble `requires` + nimble.lock SHAs
        # for deterministic dep resolution from registry/git.
        run: |
          nimble install -dy
          nimble setup
          # Hand-fix typestates srcDir flattening: nimble setup
          # writes nimble.paths with a trailing /src component but the
          # typestates pkg ships flat. Create a self-referential
          # src symlink inside each pkg dir so both layouts resolve.
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks/rust/bench-ffi-crossbeam

      - name: Build crossbeam cdylib
        # Produces target/release/libbench_ffi_crossbeam.so on Linux.
        # The Nim adapters' default {.passL.} includes -L for this path
        # so no further wiring is needed.
        run: |
          cargo build --release \
            --manifest-path benchmarks/rust/bench-ffi-crossbeam/Cargo.toml

      - name: Run cdylib integration tests
        # Sanity-check the C-ABI surface before paying for the bench
        # compile. Runs in <1s; fails the workflow on regression.
        run: |
          cargo test --release \
            --manifest-path benchmarks/rust/bench-ffi-crossbeam/Cargo.toml

      - name: Smoke crossbeam adapters
        # Compile-and-run sanity check that the adapters can resolve the
        # cdylib symbols at runtime before we spend ~10 min on bench
        # binaries with the same defines.
        run: |
          set -euo pipefail
          nim c -d:release -d:danger --threads:on \
            -d:adapter_crossbeam_array_queue_available \
            -d:adapter_crossbeam_seg_queue_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            -o:.tmp/smoke_crossbeam \
            benchmarks/nim/smoke/smoke_crossbeam.nim
          ./.tmp/smoke_crossbeam

      # ---------- v5.0.0 Bundle 5: vendored header-only C++ adapters ----------
      #
      # atomic_queue (max0x7ba) and rigtorp/SPSCQueue + rigtorp/MPMCQueue
      # are vendored single-header C++ libraries (sources under
      # benchmarks/vendor/, committed in Bundle 2). They need no apt
      # packages. Each smoke is `continue-on-error` and gated by its
      # FORCE_SKIP toggle; on success it records an env flag the
      # downstream compile/run steps gate on, so a smoke regression
      # soft-skips that adapter rather than failing the whole workflow
      # (mirrors bench.yml's install/smoke/set-define pattern).

      - name: Smoke atomic_queue adapter
        id: smoke-atomic-queue
        if: env.FORCE_SKIP_ATOMIC_QUEUE != '1'
        continue-on-error: true
        run: |
          set -euo pipefail
          # nim cpp because atomic_queue.h is C++ and the wrapper is C++.
          nim cpp -d:release -d:danger --threads:on \
            -d:adapter_atomic_queue_available \
            -o:.tmp/smoke_atomic_queue \
            benchmarks/nim/smoke/smoke_atomic_queue.nim
          ./.tmp/smoke_atomic_queue

      - name: Set atomic_queue adapter define (success only)
        if: |
          env.FORCE_SKIP_ATOMIC_QUEUE != '1' &&
          steps.smoke-atomic-queue.outcome == 'success'
        run: echo "ADAPTER_ATOMIC_QUEUE=1" >> "$GITHUB_ENV"

      - name: Annotate atomic_queue skipped
        if: |
          env.FORCE_SKIP_ATOMIC_QUEUE == '1' ||
          steps.smoke-atomic-queue.outcome != 'success'
        run: |
          echo "::warning title=Adapter skipped::atomic_queue smoke failed or force-skipped; comparison bench will omit atomic_queue slugs."

      - name: Smoke rigtorp adapters
        id: smoke-rigtorp
        if: |
          env.FORCE_SKIP_RIGTORP_SPSC != '1' ||
          env.FORCE_SKIP_RIGTORP_MPMC != '1'
        continue-on-error: true
        run: |
          set -euo pipefail
          # smoke_rigtorp.nim covers both SPSC and MPMC under their own
          # defines; enable whichever is not force-skipped. nim cpp
          # because both upstream headers are C++.
          flags=""
          if [ "${FORCE_SKIP_RIGTORP_SPSC:-}" != "1" ]; then
            flags="$flags -d:adapter_rigtorp_spsc_available"
          fi
          if [ "${FORCE_SKIP_RIGTORP_MPMC:-}" != "1" ]; then
            flags="$flags -d:adapter_rigtorp_mpmc_available"
          fi
          # shellcheck disable=SC2086  # $flags is intentionally word-split.
          nim cpp -d:release -d:danger --threads:on \
            $flags \
            -o:.tmp/smoke_rigtorp \
            benchmarks/nim/smoke/smoke_rigtorp.nim
          ./.tmp/smoke_rigtorp

      - name: Set rigtorp/SPSCQueue adapter define (success only)
        if: |
          env.FORCE_SKIP_RIGTORP_SPSC != '1' &&
          steps.smoke-rigtorp.outcome == 'success'
        run: echo "ADAPTER_RIGTORP_SPSC=1" >> "$GITHUB_ENV"

      - name: Set rigtorp/MPMCQueue adapter define (success only)
        if: |
          env.FORCE_SKIP_RIGTORP_MPMC != '1' &&
          steps.smoke-rigtorp.outcome == 'success'
        run: echo "ADAPTER_RIGTORP_MPMC=1" >> "$GITHUB_ENV"

      - name: Annotate rigtorp skipped
        if: |
          env.FORCE_SKIP_RIGTORP_SPSC == '1' ||
          env.FORCE_SKIP_RIGTORP_MPMC == '1' ||
          steps.smoke-rigtorp.outcome != 'success'
        run: |
          echo "::warning title=Adapter skipped::rigtorp smoke failed or force-skipped for at least one variant; comparison bench will omit the affected rigtorp slugs."

      # ---------- v5.0.0 Bundle 5: flume + kanal (consolidated cdylib) ----------
      #
      # flume + kanal are folded into the same libbench_ffi_crossbeam
      # cdylib already built above (Bundle 1 Cargo change). smoke_comparison
      # exercises bounded + unbounded for both; the -rpath matches the
      # crossbeam smoke so the cdylib loads at runtime without
      # LD_LIBRARY_PATH.

      - name: Smoke flume+kanal adapters
        id: smoke-comparison
        if: |
          env.FORCE_SKIP_FLUME != '1' ||
          env.FORCE_SKIP_KANAL != '1'
        continue-on-error: true
        run: |
          set -euo pipefail
          flags=""
          if [ "${FORCE_SKIP_FLUME:-}" != "1" ]; then
            flags="$flags -d:adapter_flume_available"
          fi
          if [ "${FORCE_SKIP_KANAL:-}" != "1" ]; then
            flags="$flags -d:adapter_kanal_available"
          fi
          # shellcheck disable=SC2086  # $flags is intentionally word-split.
          nim c -d:release -d:danger --threads:on \
            $flags \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            -o:.tmp/smoke_comparison \
            benchmarks/nim/smoke/smoke_comparison.nim
          ./.tmp/smoke_comparison

      - name: Set flume adapter define (success only)
        if: |
          env.FORCE_SKIP_FLUME != '1' &&
          steps.smoke-comparison.outcome == 'success'
        run: echo "ADAPTER_FLUME=1" >> "$GITHUB_ENV"

      - name: Set kanal adapter define (success only)
        if: |
          env.FORCE_SKIP_KANAL != '1' &&
          steps.smoke-comparison.outcome == 'success'
        run: echo "ADAPTER_KANAL=1" >> "$GITHUB_ENV"

      - name: Annotate flume+kanal skipped
        if: |
          env.FORCE_SKIP_FLUME == '1' ||
          env.FORCE_SKIP_KANAL == '1' ||
          steps.smoke-comparison.outcome != 'success'
        run: |
          echo "::warning title=Adapter skipped::flume/kanal smoke failed or force-skipped; comparison bench will omit the affected flume/kanal slugs."

      # ---------- v5.0.0 Bundle 5: vendored liblfds (C library) ----------
      #
      # liblfds 7.1.1 ships C source under benchmarks/vendor/liblfds/liblfds711/src/.
      # Compile the vendored C sources directly into liblfds711.a matching
      # build_liblfds() in benchmarks/runner.py.

      - name: Install liblfds (vendored C build)
        id: install-liblfds
        if: env.FORCE_SKIP_LIBLFDS != '1'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p benchmarks/vendor/liblfds/liblfds711/bin benchmarks/vendor/liblfds/liblfds711/obj
          for src in benchmarks/vendor/liblfds/liblfds711/src/*/*.c; do
            obj="benchmarks/vendor/liblfds/liblfds711/obj/$(basename "$(dirname "$src")")_$(basename "$src" .c).o"
            cc -O3 -fPIC -D__linux__ -Ibenchmarks/vendor/liblfds/liblfds711/inc -c "$src" -o "$obj"
          done
          ar rcs benchmarks/vendor/liblfds/liblfds711/bin/liblfds711.a benchmarks/vendor/liblfds/liblfds711/obj/*.o
          test -f benchmarks/vendor/liblfds/liblfds711/bin/liblfds711.a

      - name: Smoke liblfds adapter
        id: smoke-liblfds
        if: |
          env.FORCE_SKIP_LIBLFDS != '1' &&
          steps.install-liblfds.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          # liblfds is C-only; the wrapper is C; no `nim cpp` needed.
          # --passL points at the vendored archive built above.
          nim c -d:release -d:danger --threads:on \
            -d:adapter_liblfds_available \
            --passL:"-Lbenchmarks/vendor/liblfds/liblfds711/bin -llfds711" \
            -o:.tmp/smoke_liblfds \
            benchmarks/nim/smoke/smoke_liblfds.nim
          ./.tmp/smoke_liblfds

      - name: Set liblfds adapter define (success only)
        if: |
          env.FORCE_SKIP_LIBLFDS != '1' &&
          steps.install-liblfds.outcome == 'success' &&
          steps.smoke-liblfds.outcome == 'success'
        run: |
          echo "ADAPTER_LIBLFDS=1" >> "$GITHUB_ENV"
          # Absolute path so the bench compile's -L resolves regardless
          # of nim's working directory.
          echo "LIBLFDS_LIB_DIR=${GITHUB_WORKSPACE}/benchmarks/vendor/liblfds/liblfds711/bin" >> "$GITHUB_ENV"

      - name: Annotate liblfds skipped
        if: |
          env.FORCE_SKIP_LIBLFDS == '1' ||
          steps.install-liblfds.outcome != 'success' ||
          steps.smoke-liblfds.outcome != 'success'
        run: |
          echo "::warning title=Adapter skipped::liblfds build or smoke failed or force-skipped; comparison bench will omit liblfds slugs."

      - name: Compile bench_mpmc_bounded with crossbeam_array_queue
        #: crossbeam_array_queue's slug shape matches
        # the mpmc grid so it lives in the mpmc binary (the spmc
        # binary has no MVP-adapter wiring). CI run shape mirrors
        # bench.yml's bench_mpmc_bounded settings (1M / 5 / 2). rpath
        # ensures the dylib loads from the in-tree build dir at runtime
        # without needing LD_LIBRARY_PATH.
        run: |
          set -euo pipefail
          nim c -d:release -d:danger --threads:on \
            -d:BenchMpmcMessageCount=1000000 \
            -d:BenchMpmcRuns=5 \
            -d:BenchMpmcWarmup=2 \
            -d:adapter_crossbeam_array_queue_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            benchmarks/nim/bench_mpmc_bounded.nim

      - name: Compile bench_unbounded_mpmc with crossbeam_seg_queue
        # split: the Crossbeam SegQueue adapter lives in
        # bench_unbounded_mpmc (matches the mpmc unbounded
        # MVP-adapter slot post-split).
        run: |
          set -euo pipefail
          nim c -d:release -d:danger --threads:on \
            -d:UnboundedMpmcMessageCount=500000 \
            -d:UnboundedMpmcRuns=3 \
            -d:BenchUnboundedWarmup=2 \
            -d:adapter_crossbeam_seg_queue_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            benchmarks/nim/bench_unbounded_mpmc.nim

      - name: Run bench_mpmc_bounded (crossbeam_array_queue only)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          ./.tmp/bench_mpmc_bounded crossbeam_array_queue \
            --bmf-out=bench_mpmc_crossbeam.json \
            | tee bench_mpmc_crossbeam_output.txt

      - name: Run bench_unbounded_mpmc (crossbeam_seg_queue only)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          ./.tmp/bench_unbounded_mpmc crossbeam_seg_queue \
            --bmf-out=bench_unbounded_crossbeam.json \
            | tee bench_unbounded_crossbeam_output.txt

      # ---------- v5.0.0 Bundle 5: external-adapter compile + run ----------
      #
      # Each enabled adapter compiles ITS bench binary to a distinct
      # `-o:.tmp/<binary>_<adapter>` output so it does not clobber the
      # crossbeam binaries (or another adapter sharing the same source
      # binary), then runs only its own variant slug. This mirrors the
      # crossbeam one-compile-one-run pattern above while staying
      # collision-safe in the linear single-job layout. Each step is
      # gated on the ADAPTER_<LIB> env flag set by the smoke steps, so a
      # soft-skipped adapter contributes no compile, no run, and no BMF
      # fragment. CI run shapes mirror bench.yml: bench_spsc 1M/5/2,
      # bench_mpmc_bounded 1M/5/2, bench_unbounded_mpmc 500K/3/2.

      # --- atomic_queue: bench_spsc + bench_mpmc_bounded ---
      - name: Compile + run bench_spsc with atomic_queue
        if: env.ADAPTER_ATOMIC_QUEUE == '1'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim cpp -d:release -d:danger --threads:on \
            -d:BenchSpscMessageCount=1000000 \
            -d:BenchSpscRuns=5 \
            -d:BenchSpscWarmup=2 \
            -d:adapter_atomic_queue_available \
            -o:.tmp/bench_spsc_atomic_queue \
            benchmarks/nim/bench_spsc.nim
          ./.tmp/bench_spsc_atomic_queue atomic_queue \
            --bmf-out=bench_spsc_atomic_queue.json \
            | tee bench_spsc_atomic_queue_output.txt

      - name: Compile + run bench_mpmc_bounded with atomic_queue
        if: env.ADAPTER_ATOMIC_QUEUE == '1'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim cpp -d:release -d:danger --threads:on \
            -d:BenchMpmcMessageCount=1000000 \
            -d:BenchMpmcRuns=5 \
            -d:BenchMpmcWarmup=2 \
            -d:adapter_atomic_queue_available \
            -o:.tmp/bench_mpmc_atomic_queue \
            benchmarks/nim/bench_mpmc_bounded.nim
          ./.tmp/bench_mpmc_atomic_queue atomic_queue \
            --bmf-out=bench_mpmc_atomic_queue.json \
            | tee bench_mpmc_atomic_queue_output.txt

      # --- rigtorp/SPSCQueue: bench_spsc only ---
      - name: Compile + run bench_spsc with rigtorp_spsc
        if: env.ADAPTER_RIGTORP_SPSC == '1'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim cpp -d:release -d:danger --threads:on \
            -d:BenchSpscMessageCount=1000000 \
            -d:BenchSpscRuns=5 \
            -d:BenchSpscWarmup=2 \
            -d:adapter_rigtorp_spsc_available \
            -o:.tmp/bench_spsc_rigtorp_spsc \
            benchmarks/nim/bench_spsc.nim
          ./.tmp/bench_spsc_rigtorp_spsc rigtorp_spsc \
            --bmf-out=bench_spsc_rigtorp_spsc.json \
            | tee bench_spsc_rigtorp_spsc_output.txt

      # --- rigtorp/MPMCQueue: bench_mpmc_bounded only ---
      - name: Compile + run bench_mpmc_bounded with rigtorp_mpmc
        if: env.ADAPTER_RIGTORP_MPMC == '1'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim cpp -d:release -d:danger --threads:on \
            -d:BenchMpmcMessageCount=1000000 \
            -d:BenchMpmcRuns=5 \
            -d:BenchMpmcWarmup=2 \
            -d:adapter_rigtorp_mpmc_available \
            -o:.tmp/bench_mpmc_rigtorp_mpmc \
            benchmarks/nim/bench_mpmc_bounded.nim
          ./.tmp/bench_mpmc_rigtorp_mpmc rigtorp_mpmc \
            --bmf-out=bench_mpmc_rigtorp_mpmc.json \
            | tee bench_mpmc_rigtorp_mpmc_output.txt

      # --- flume: bench_mpmc_bounded (bounded) + bench_unbounded_mpmc ---
      - name: Compile + run bench_mpmc_bounded with flume
        if: env.ADAPTER_FLUME == '1'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim c -d:release -d:danger --threads:on \
            -d:BenchMpmcMessageCount=1000000 \
            -d:BenchMpmcRuns=5 \
            -d:BenchMpmcWarmup=2 \
            -d:adapter_flume_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            -o:.tmp/bench_mpmc_flume \
            benchmarks/nim/bench_mpmc_bounded.nim
          ./.tmp/bench_mpmc_flume flume \
            --bmf-out=bench_mpmc_flume.json \
            | tee bench_mpmc_flume_output.txt

      - name: Compile + run bench_unbounded_mpmc with flume_unbounded
        if: env.ADAPTER_FLUME == '1'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim c -d:release -d:danger --threads:on \
            -d:UnboundedMpmcMessageCount=500000 \
            -d:UnboundedMpmcRuns=3 \
            -d:BenchUnboundedWarmup=2 \
            -d:adapter_flume_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            -o:.tmp/bench_unbounded_flume \
            benchmarks/nim/bench_unbounded_mpmc.nim
          ./.tmp/bench_unbounded_flume flume_unbounded \
            --bmf-out=bench_unbounded_flume.json \
            | tee bench_unbounded_flume_output.txt

      # --- kanal: bench_spsc + bench_mpmc_bounded (bounded) + bench_unbounded_mpmc ---
      - name: Compile + run bench_spsc with kanal
        if: env.ADAPTER_KANAL == '1'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim c -d:release -d:danger --threads:on \
            -d:BenchSpscMessageCount=1000000 \
            -d:BenchSpscRuns=5 \
            -d:BenchSpscWarmup=2 \
            -d:adapter_kanal_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            -o:.tmp/bench_spsc_kanal \
            benchmarks/nim/bench_spsc.nim
          ./.tmp/bench_spsc_kanal kanal \
            --bmf-out=bench_spsc_kanal.json \
            | tee bench_spsc_kanal_output.txt

      - name: Compile + run bench_mpmc_bounded with kanal
        if: env.ADAPTER_KANAL == '1'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim c -d:release -d:danger --threads:on \
            -d:BenchMpmcMessageCount=1000000 \
            -d:BenchMpmcRuns=5 \
            -d:BenchMpmcWarmup=2 \
            -d:adapter_kanal_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            -o:.tmp/bench_mpmc_kanal \
            benchmarks/nim/bench_mpmc_bounded.nim
          ./.tmp/bench_mpmc_kanal kanal \
            --bmf-out=bench_mpmc_kanal.json \
            | tee bench_mpmc_kanal_output.txt

      - name: Compile + run bench_unbounded_mpmc with kanal_unbounded
        if: env.ADAPTER_KANAL == '1'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim c -d:release -d:danger --threads:on \
            -d:UnboundedMpmcMessageCount=500000 \
            -d:UnboundedMpmcRuns=3 \
            -d:BenchUnboundedWarmup=2 \
            -d:adapter_kanal_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            -o:.tmp/bench_unbounded_kanal \
            benchmarks/nim/bench_unbounded_mpmc.nim
          ./.tmp/bench_unbounded_kanal kanal_unbounded \
            --bmf-out=bench_unbounded_kanal.json \
            | tee bench_unbounded_kanal_output.txt

      # --- liblfds: bench_spsc (bss) + bench_mpmc_bounded (bmm) ---
      - name: Compile + run bench_spsc with liblfds
        if: env.ADAPTER_LIBLFDS == '1'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim c -d:release -d:danger --threads:on \
            -d:BenchSpscMessageCount=1000000 \
            -d:BenchSpscRuns=5 \
            -d:BenchSpscWarmup=2 \
            -d:adapter_liblfds_available \
            --passL:"-L${LIBLFDS_LIB_DIR} -llfds711" \
            -o:.tmp/bench_spsc_liblfds \
            benchmarks/nim/bench_spsc.nim
          ./.tmp/bench_spsc_liblfds liblfds \
            --bmf-out=bench_spsc_liblfds.json \
            | tee bench_spsc_liblfds_output.txt

      - name: Compile + run bench_mpmc_bounded with liblfds
        if: env.ADAPTER_LIBLFDS == '1'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim c -d:release -d:danger --threads:on \
            -d:BenchMpmcMessageCount=1000000 \
            -d:BenchMpmcRuns=5 \
            -d:BenchMpmcWarmup=2 \
            -d:adapter_liblfds_available \
            --passL:"-L${LIBLFDS_LIB_DIR} -llfds711" \
            -o:.tmp/bench_mpmc_liblfds \
            benchmarks/nim/bench_mpmc_bounded.nim
          ./.tmp/bench_mpmc_liblfds liblfds \
            --bmf-out=bench_mpmc_liblfds.json \
            | tee bench_mpmc_liblfds_output.txt

      # ---------- Subsystem benchmarks (Nim + Rust FFI comparison) ----------

      - name: Compile + run bench_maps
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim cpp -d:release -d:danger --threads:on \
            -d:BenchMapRuns=3 \
            -d:BenchMapWarmup=1 \
            -d:BenchMapOpsPerThread=20000 \
            -d:adapter_rust_ffi_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            -o:.tmp/bench_maps \
            benchmarks/nim/bench_maps.nim
          ./.tmp/bench_maps \
            --bmf-out=bench_maps.json \
            | tee bench_maps_output.txt

      - name: Compile + run bench_stacks_deques
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim cpp -d:release -d:danger --threads:on \
            -d:BenchStackRuns=3 \
            -d:BenchStackWarmup=1 \
            -d:BenchStackMsgCount=100000 \
            -d:adapter_rust_ffi_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            -o:.tmp/bench_stacks_deques \
            benchmarks/nim/bench_stacks_deques.nim
          ./.tmp/bench_stacks_deques \
            --bmf-out=bench_stacks_deques.json \
            | tee bench_stacks_deques_output.txt

      - name: Compile + run bench_broadcast
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim cpp -d:release -d:danger --threads:on \
            -d:BenchBroadcastRuns=3 \
            -d:BenchBroadcastWarmup=1 \
            -d:BenchBroadcastMsgCount=50000 \
            -d:adapter_rust_ffi_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            -o:.tmp/bench_broadcast \
            benchmarks/nim/bench_broadcast.nim
          ./.tmp/bench_broadcast \
            --bmf-out=bench_broadcast.json \
            | tee bench_broadcast_output.txt

      - name: Compile + run bench_ratelimit_streaming
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim cpp -d:release -d:danger --threads:on \
            -d:BenchRLRuns=3 \
            -d:BenchRLWarmup=1 \
            -d:BenchTokenCount=100000 \
            -d:BenchStreamBytes=16777216 \
            -d:adapter_rust_ffi_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            -o:.tmp/bench_ratelimit_streaming \
            benchmarks/nim/bench_ratelimit_streaming.nim
          ./.tmp/bench_ratelimit_streaming \
            --bmf-out=bench_ratelimit_streaming.json \
            | tee bench_ratelimit_streaming_output.txt

      - name: Compile + run bench_rendezvous
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim cpp -d:release -d:danger --threads:on \
            -d:BenchRendezvousRuns=3 \
            -d:BenchRendezvousWarmup=1 \
            -d:BenchRendezvousMsgCount=20000 \
            -d:BenchRendezvousRpcCount=10000 \
            -d:adapter_rust_ffi_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            -o:.tmp/bench_rendezvous \
            benchmarks/nim/bench_rendezvous.nim
          ./.tmp/bench_rendezvous \
            --bmf-out=bench_rendezvous.json \
            | tee bench_rendezvous_output.txt

      - name: Compile + run bench_taskpool
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim cpp -d:release -d:danger --threads:on \
            -d:BenchTaskPoolRuns=3 \
            -d:BenchTaskPoolWarmup=1 \
            -d:BenchParForCount=50000 \
            -d:BenchForkJoinDepth=11 \
            -d:BenchSpawnSyncCount=10000 \
            -d:adapter_rust_ffi_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            -o:.tmp/bench_taskpool \
            benchmarks/nim/bench_taskpool.nim
          ./.tmp/bench_taskpool \
            --bmf-out=bench_taskpool.json \
            | tee bench_taskpool_output.txt

      - name: Compile + run bench_smr_nebr
        timeout-minutes: 12
        run: |
          set -euo pipefail
          nim cpp -d:release -d:danger --threads:on \
            -d:BenchSmrRuns=3 \
            -d:BenchSmrWarmup=1 \
            -d:BenchPinOpsPerThread=50000 \
            -d:BenchRetireOpsPerThread=10000 \
            -d:adapter_rust_ffi_available \
            --passL:"-Wl,-rpath,$(pwd)/benchmarks/rust/bench-ffi-crossbeam/target/release" \
            -o:.tmp/bench_smr_nebr \
            benchmarks/nim/bench_smr_nebr.nim
          ./.tmp/bench_smr_nebr \
            --bmf-out=bench_smr_nebr.json \
            | tee bench_smr_nebr_output.txt

      - name: Merge BMF JSON
        # Crossbeam fragments are always present (no soft-skip); the
        # external-adapter fragments exist only for adapters that passed
        # smoke + ran. `merge_bmf.py` errors on a missing input, so the
        # input list is built dynamically from the JSON files actually
        # on disk. The two crossbeam fragments anchor the list so a run
        # where every external adapter soft-skipped still merges.
        run: |
          set -euo pipefail
          inputs="bench_mpmc_crossbeam.json bench_unbounded_crossbeam.json"
          for f in \
            bench_spsc_atomic_queue.json \
            bench_mpmc_atomic_queue.json \
            bench_spsc_rigtorp_spsc.json \
            bench_mpmc_rigtorp_mpmc.json \
            bench_mpmc_flume.json \
            bench_unbounded_flume.json \
            bench_spsc_kanal.json \
            bench_mpmc_kanal.json \
            bench_unbounded_kanal.json \
            bench_spsc_liblfds.json \
            bench_mpmc_liblfds.json \
            bench_maps.json \
            bench_stacks_deques.json \
            bench_broadcast.json \
            bench_ratelimit_streaming.json \
            bench_rendezvous.json \
            bench_taskpool.json \
            bench_smr_nebr.json; do
            if [ -f "$f" ]; then
              inputs="$inputs $f"
            fi
          done
          echo "Merging BMF fragments: $inputs"
          # shellcheck disable=SC2086  # $inputs is intentionally word-split.
          python3 benchmarks/merge_bmf.py merged.json $inputs

      - name: Show BMF JSON (debug)
        run: cat merged.json

      - name: Upload BMF artifact
        uses: actions/upload-artifact@v4
        with:
          # v5.0.0 Bundle 5: this merged fragment now spans crossbeam +
          # the external-adapter set (atomic_queue, rigtorp, flume,
          # kanal, liblfds) + subsystem benchmarks.
          name: bench-comparison-external-bmf
          path: merged.json
