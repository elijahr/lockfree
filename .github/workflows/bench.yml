# yamllint disable rule:line-length

name: bench

# yamllint disable rule:truthy
on:
  push:
    branches: [main, devel]
    paths-ignore:
      - '*.md'
      - '.github/workflows/docs.yml'
      - 'docs/assets/bench-results/**'
  workflow_dispatch:
    inputs:
      force_skip_boost:
        description: 'Force boost soft-skip (Track 3 §2.6 acceptance)'
        type: boolean
        default: false
      force_skip_loony:
        description: 'Force loony soft-skip (Track 3 §2.6 acceptance)'
        type: boolean
        default: false
      force_skip_moodycamel:
        description: 'Force MoodyCamel soft-skip (Track 4 §4.7 acceptance)'
        type: boolean
        default: false
      force_skip_threading_channels:
        description: 'Force threading.Chan soft-skip (Track 4 §4.7 acceptance)'
        type: boolean
        default: false
      force_skip_nim_channel:
        description: 'Force system.Channel soft-skip (Track 4 §4.7 acceptance)'
        type: boolean
        default: false
# yamllint enable rule:truthy

# Cancel superseded runs on the same ref immediately when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FORCE_SKIP_BOOST: ${{ inputs.force_skip_boost && '1' || '' }}
  FORCE_SKIP_LOONY: ${{ inputs.force_skip_loony && '1' || '' }}
  FORCE_SKIP_MOODYCAMEL: ${{ inputs.force_skip_moodycamel && '1' || '' }}
  FORCE_SKIP_THREADING_CHANNELS: ${{ inputs.force_skip_threading_channels && '1' || '' }}
  FORCE_SKIP_NIM_CHANNEL: ${{ inputs.force_skip_nim_channel && '1' || '' }}
  CPATH: /opt/homebrew/include
  LIBRARY_PATH: /opt/homebrew/lib

jobs:
  bench:
    name: bench (macOS-m4-pro)
    runs-on: [self-hosted, macOS, ARM64]
    if: |
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
      actions: write
      pull-requests: write
      checks: write
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean workspace (clean slate)
        run: |
          rm -rf .tmp/ *.json bmf-inputs/ benchmarks/nim/smoke/.tmp
          mkdir -p .tmp

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install dependencies from nimble registry
        run: |
          nimble install -dy
          nimble setup
          nimble install -y threading loony
          for d in $(find ~/.nimble/pkgs2 -maxdepth 1 -type d -name "typestates-*" 2>/dev/null); do
            [ -e "$d/src" ] || ln -s . "$d/src"
          done

      - name: Run bench harness tests
        run: nimble benchtests

      - name: Run Python chart and BMF contract tests
        run: python3 -m unittest discover -s benchmarks/tests -p "test_*.py" -v

      - name: Install boost (libboost-dev for Boost.LockFree)
        id: install-boost
        if: env.FORCE_SKIP_BOOST != '1'
        continue-on-error: true
        run: |
          brew list boost &>/dev/null || brew install boost

      - name: Smoke boost adapters
        id: smoke-boost
        if: env.FORCE_SKIP_BOOST != '1' && steps.install-boost.outcome == 'success'
        continue-on-error: true
        run: |
          nim cpp -d:release -d:danger --threads:on \
            -d:adapter_boost_lockfree_queue_available \
            -d:adapter_boost_lockfree_spsc_available \
            -o:.tmp/smoke_boost \
            benchmarks/nim/smoke/smoke_boost.nim
          ./.tmp/smoke_boost

      - name: Build Rust bench-ffi-crossbeam crate
        id: build-rust-ffi
        continue-on-error: true
        run: |
          cargo build --release --manifest-path benchmarks/rust/bench-ffi-crossbeam/Cargo.toml

      - name: Build vendored liblfds711
        id: build-liblfds
        continue-on-error: true
        run: |
          python3 -c "import benchmarks.runner as r; r.build_liblfds()"

      - name: Run benchmarks sequentially
        run: |
          bash benchmarks/scripts/run_benchmarks.sh

      - name: Merge BMF JSON
        id: merge
        run: |
          python3 benchmarks/merge_bmf.py merged.json .tmp/*.json

      - name: Verify deletion-safety against pre-split fixture
        run: |
          python3 benchmarks/scripts/superset_check.py \
            tests/fixtures/pre-split-slugs.json \
            merged.json

      - name: Show BMF JSON (debug)
        run: cat merged.json

      - name: Snapshot to docs assets (main / devel push)
        if: |
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')
        run: |
          set -euo pipefail
          TARGET_BRANCH="${{ github.ref_name }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p docs/assets/bench-results
          find docs/assets/bench-results/ -type f -name '*.json' ! -name 'example.json' ! -name 'latest.json' -delete
          SHA=$(git rev-parse --short HEAD)
          cp merged.json "docs/assets/bench-results/${SHA}.json"
          cp merged.json docs/assets/bench-results/latest.json
          cp merged.json docs/assets/bench-results/example.json
          python3 -m unittest discover -s benchmarks/tests -p "test_*.py"
          python3 benchmarks/scripts/generate_readme_benchmarks.py \
            --bmf docs/assets/bench-results/latest.json \
            --svg-hero docs/assets/bench-results/hero-throughput.svg \
            --svg-latency docs/assets/bench-results/latency-ladder.svg \
            --readme README.md
          git add docs/assets/bench-results/ README.md
          if git diff --cached --quiet; then
            echo "::notice::Snapshot identical to current checked-in latest.json; skipping commit."
            exit 0
          fi
          git commit -m "chore(bench): refresh snapshot [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "::notice::push attempt $attempt rejected; rebasing onto origin/${TARGET_BRANCH} and retrying."
            git fetch origin "${TARGET_BRANCH}"
            if ! git rebase "origin/${TARGET_BRANCH}"; then
              git rebase --abort || true
              echo "::warning::rebase attempt $attempt failed; aborted and continuing retry loop."
            fi
          done
          echo "::error::Snapshot push failed after 3 retries; aborting." >&2
          exit 1

      - name: Snapshot to docs assets (PR branch push)
        if: |
          github.event_name == 'pull_request' &&
          github.actor != 'github-actions[bot]' &&
          github.event.pull_request.head.repo.fork == false
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin "$HEAD_REF":"refs/remotes/origin/$HEAD_REF"
          git checkout -B "$HEAD_REF" "refs/remotes/origin/$HEAD_REF"
          mkdir -p docs/assets/bench-results
          find docs/assets/bench-results/ -type f -name '*.json' ! -name 'example.json' ! -name 'latest.json' -delete
          SHA=$(git rev-parse --short HEAD)
          cp merged.json "docs/assets/bench-results/${SHA}.json"
          cp merged.json docs/assets/bench-results/latest.json
          cp merged.json docs/assets/bench-results/example.json
          python3 -m unittest discover -s benchmarks/tests -p "test_*.py"
          python3 benchmarks/scripts/generate_readme_benchmarks.py \
            --bmf docs/assets/bench-results/latest.json \
            --svg-hero docs/assets/bench-results/hero-throughput.svg \
            --svg-latency docs/assets/bench-results/latency-ladder.svg \
            --readme README.md
          git add docs/assets/bench-results/ README.md
          if git diff --cached --quiet; then
            echo "::notice::PR-branch snapshot identical to current checked-in copy; skipping commit."
            exit 0
          fi
          git commit -m "chore(bench): refresh snapshot for PR [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$HEAD_REF"; then
              exit 0
            fi
            echo "::notice::PR-branch push attempt $attempt rejected; rebasing onto origin/$HEAD_REF and retrying."
            git fetch origin "$HEAD_REF"
            if ! git rebase "origin/$HEAD_REF"; then
              git rebase --abort || true
              echo "::warning::PR-branch rebase attempt $attempt failed; aborted and continuing retry loop."
            fi
          done
          echo "::error::PR-branch snapshot push failed after 3 retries; aborting." >&2
          exit 1

      - name: Defensive snapshot fallback
        if: |
          always() && (
            (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')) ||
            (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel'))
          ) && (steps.merge.outcome == 'failure' || steps.merge.outcome == 'cancelled')
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p docs/assets/bench-results
          cat > docs/assets/bench-results/latest.json <<'EOF'
          {
            "_status": "fallback",
            "_reason": "merge_bmf step ${{ steps.merge.outcome }}",
            "_merge_outcome": "${{ steps.merge.outcome }}",
            "_timestamp": "${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}",
            "_workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          git add docs/assets/bench-results/latest.json
          if git diff --cached --quiet; then
            echo "::notice::Fallback latest.json identical to current checked-in copy; skipping commit."
            exit 0
          fi
          git commit -m "bench: defensive fallback snapshot [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            echo "::notice::fallback push attempt $attempt rejected; rebasing onto origin/${TARGET_BRANCH} and retrying."
            git fetch origin "${TARGET_BRANCH}"
            if ! git rebase "origin/${TARGET_BRANCH}"; then
              git rebase --abort || true
              echo "::warning::fallback rebase attempt $attempt failed; aborted and continuing retry loop."
            fi
          done
          echo "::error::Fallback snapshot push failed after 3 retries; aborting." >&2
          exit 1

      - name: Trigger docs redeploy
        if: |
          always() && (
            (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel')) ||
            (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel'))
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --ref "${{ github.ref_name }}"
