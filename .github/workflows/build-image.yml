name: build-image

on:
  push:
    branches: [main, devel]
    paths:
      - '.github/docker/lockfree-ci.Dockerfile'
      - '.github/workflows/build-image.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          # Image repo owner is the GitHub repo owner (lowercased for ghcr)
          OWNER_RAW="${{ github.repository_owner }}"
          OWNER=$(echo "${OWNER_RAW}" | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${OWNER}/lockfree-ci"
          {
            echo "image=${IMG}"
            echo "sha_tag=${IMG}:nim-2.2.10-${SHORT_SHA}"
            echo "latest_tag=${IMG}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/lockfree-ci.Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.latest_tag }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
