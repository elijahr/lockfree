--path:"../src/"

@if not release and not danger:
  # Do not optimize for speed/size
  --opt:none

  # debuggable
  --define:debug
  --debuginfo
  --debugger:native
  --lineDir:on
@end

--showAllMismatches:on
--styleCheck:hint

--define:testing

# threading
--threads:on
--tlsEmulation:off

# Test suites import utility/DSL helper modules across files
--warning[UnusedImport]:off
