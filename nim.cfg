# nim.cfg - Project build options

# Memory management & concurrency standard
--mm:orc
--threads:on

# Code style hint
--styleCheck:hint

# Utilize all available CPU cores for the C compiler backend
--parallelBuild:0

# Default output directory for compiled binaries
--outdir:".tmp"

# Required for nim-debra v0.10.0 DWCAS dependency (16-byte CAS).
# Mirrors debra's own nim.cfg: gcc/clang on amd64 need -mcx16; gcc on arm64
# needs LSE atomics inlined (not routed through libgcc outline helpers);
# clang on arm64 needs -march for LSE codegen. MSVC (vcc) is excluded
# because it rejects -mcx16 with D9002 and uses _InterlockedCompareExchange128
# intrinsics instead. macOS ARM64 has LSE by default but the flag is harmless.
@if (amd64 or x86_64) and (gcc or clang) and not vcc:
  passC = "-mcx16"
@elif arm64 and gcc and not vcc:
  passC = "-march=armv8.1-a+lse -mno-outline-atomics"
@elif arm64 and clang and not vcc:
  passC = "-march=armv8.1-a+lse"
@end

# On Windows, Nim's default thread-local allocator has an upstream multithreaded
# race in `alloc.nim:addToSharedFreeList` during cross-thread deallocations.
# Using standard C runtime allocator (malloc/free) bypasses alloc.nim safely.
@if windows:
  define = "useMalloc"
@end

# Optional item count tracking for Queue (contention reduction).
# Default enabled in debug/test config for len() assertions;
# disabled in release builds to eliminate atomic fetchAdd/fetchSub contention.
@if not release:
  define = "lockfreeTrackItemCount"
@end

# Silence benign openSym injection warning for generic template type bindings
--warning[IgnoredSymbolInjection]:off
