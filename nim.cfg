# nim.cfg - Project build options

# Memory management & concurrency standard
--mm:orc
--threads:on

# Code style hint
--styleCheck:hint

# Utilize all available CPU cores for the C compiler backend
--parallelBuild:0

# Default output directory for compiled binaries
--outdir:".tmp"

# Required for nim-debra v0.10.0 DWCAS dependency (16-byte CAS).
# Mirrors debra's own nim.cfg: gcc/clang on amd64 need -mcx16; gcc on arm64
# needs LSE atomics inlined (not routed through libgcc outline helpers);
# clang on arm64 needs -march for LSE codegen. Scoped per compiler backend
# (`gcc.*` / `clang.*`) rather than unconditional `passC` because Nim parses
# `nim.cfg` before CLI `--cc:vcc`, and MSVC rejects `-mcx16` with D9002.
@if amd64 or x86_64:
  gcc.options.always %= "${gcc.options.always} -mcx16"
  gcc.cpp.options.always %= "${gcc.cpp.options.always} -mcx16"
  clang.options.always %= "${clang.options.always} -mcx16"
  clang.cpp.options.always %= "${clang.cpp.options.always} -mcx16"
@elif arm64 or aarch64:
  gcc.options.always %= "${gcc.options.always} -march=armv8.1-a+lse -mno-outline-atomics"
  gcc.cpp.options.always %= "${gcc.cpp.options.always} -march=armv8.1-a+lse -mno-outline-atomics"
  clang.options.always %= "${clang.options.always} -march=armv8.1-a+lse"
  clang.cpp.options.always %= "${clang.cpp.options.always} -march=armv8.1-a+lse"
@end

# On Windows, Nim's default thread-local allocator has an upstream multithreaded
# race in `alloc.nim:addToSharedFreeList` during cross-thread deallocations.
# Using standard C runtime allocator (malloc/free) bypasses alloc.nim safely.
@if windows:
  define = "useMalloc"
@end

# Silence benign openSym injection warning for generic template type bindings
--warning[IgnoredSymbolInjection]:off
