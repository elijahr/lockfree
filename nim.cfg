# Default output directory for compiled binaries
--outdir:".tmp"

# Required for nim-debra v0.10.0 DWCAS dependency (16-byte CAS).
# Mirrors debra's own nim.cfg: gcc/clang on amd64 need -mcx16; gcc on arm64
# needs LSE atomics inlined (not routed through libgcc outline helpers);
# clang on arm64 needs -march for LSE codegen. MSVC (vcc) is excluded
# because it rejects -mcx16 with D9002 and uses _InterlockedCompareExchange128
# intrinsics instead. macOS ARM64 has LSE by default but the flag is harmless.
@if (amd64 or x86_64) and (gcc or clang) and not vcc:
  passC = "-mcx16"
@elif arm64 and gcc and not vcc:
  passC = "-march=armv8.1-a+lse -mno-outline-atomics"
@elif arm64 and clang and not vcc:
  passC = "-march=armv8.1-a+lse"
@end

# Use all CPU cores for the C-compile step. Nim's default --parallelBuild
# is 1 (single-threaded). 0 means "use all cores". Cell-1 compile-bound
# work was ~20 min cold; this should cut the cc step proportional to
# core count (12-core M-series → ~3-4× cc step speedup; GHA ubuntu-latest
# 4 cores → ~3× speedup).
--parallelBuild:0
