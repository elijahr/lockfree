site_name: lockfree
site_description: Lock-free concurrency primitives, data structures, and safe memory reclamation for Nim and C
site_url: https://elijahr.github.io/lockfree/

repo_name: elijahr/lockfree
repo_url: https://github.com/elijahr/lockfree

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - toc.follow

plugins:
  - search
  - include-markdown:
      opening_tag: "{%"
      closing_tag: "%}"
  - mike:
      alias_type: symlink
      canonical_version: latest
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
      type: timeago
  - glightbox
  - mkdocstrings:
      default_handler: nim
      handlers:
        nim:
          paths: [src]
          options:
            docstring_style: rst
            show_source: true
            show_signature: true
            show_attribution: false  # drops "Generated by mkdocstrings" footer (typestates pattern)
            heading_level: 3  # h3 so procs nest under h2 API section in TOC
            source_url: https://github.com/elijahr/lockfree
            # source_ref drives the github blob URL stamped on each
            # source-link. Auto-detection from the working tree fails on
            # CI (actions/checkout produces a detached HEAD), so we read
            # it from DOCS_SOURCE_REF and default to `devel` (this repo's
            # default branch — verified via gh repo view) so local
            # `mkdocs serve` produces working source links without env
            # setup. CI exports the right value per trigger: PR -> head
            # ref, devel push -> devel, v* tag -> tag name.
            source_ref: !ENV [DOCS_SOURCE_REF, devel]

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4  # Include h2, h3, h4 in right-side TOC

